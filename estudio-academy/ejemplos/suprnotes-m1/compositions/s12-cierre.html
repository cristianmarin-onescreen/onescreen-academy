<script>
(function () {

  ];
  const svgNS = "http://www.w3.org/2000/svg";
  const mk = (html) => { const d = document.createElement("div"); d.innerHTML = html; return d.firstElementChild; };

  // ---------- construccion ----------
  const caps = ['Tu contenido se vuelve <em>material de estudio</em>', 'Cinco salidas <em>en paralelo</em>', 'Solo usa <em>tus fuentes</em>'];
  const cards = [], zones = [];
  for (let i = 0; i < 3; i++) {
    const d = mk('<div class="ac-glass card" id="s12-c' + i + '" style="left:' + LEFT[i] + 'px;--c:' + ACC[i] + '"><div class="num" id="s12-n' + i + '">' + (i + 1) + '</div><div class="zone" data-layout-allow-overlap id="s12-z' + i + '"></div><div class="bar fade" id="s12-b' + i + '"></div><div class="cap fade" id="s12-cap' + i + '">' + caps[i] + '</div></div>');
    stage.appendChild(d); cards.push(d); zones.push(d.querySelector(".zone"));
  }
  // idea 1
  zones[0].innerHTML =
    '<svg class="ac-links" id="s12-l1" viewBox="0 0 480 300" style="width:480px;height:300px;inset:auto;left:0;top:0"></svg>' +
    '<div class="sheet" id="s12-sheet"><i class="h"></i><i></i><i></i><i style="width:80%"></i><i></i><i style="width:55%"></i></div>' +
    '<img class="snconv" id="s12-snconv" src="assets/sn-app-icon.png" alt="SuprNotes">' +
    '<div class="lab" id="s12-lab1" style="left:12px;width:160px;top:250px">contenido</div>' +

    '<div class="scard" data-layout-allow-overlap id="s12-sc1" style="left:282px;top:112px"><u></u><b>ecosistema</b><i></i><i style="width:55%"></i></div>' +
    '<div class="lab" id="s12-lab2" style="left:262px;width:210px;top:250px">material de estudio</div>';
  // idea 2

  // idea 3
  zones[2].innerHTML =
    '<div class="shfill" id="s12-shf"><svg viewBox="0 0 48 48" width="200" height="200"><path d="M24 6l15 5v12c0 10-7 16-15 19C16 39 9 33 9 23V11z" fill="rgba(125,240,255,.22)"/></svg></div>' +
    '<svg class="shield" id="s12-sh" viewBox="0 0 48 48"><path id="s12-shp" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M24 6l15 5v12c0 10-7 16-15 19C16 39 9 33 9 23V11z"/></svg>' +
    '<svg class="lock" id="s12-lock" viewBox="0 0 48 48"><rect x="10" y="21" width="28" height="20" rx="5"/><path id="s12-shk" d="M16 21v-6a8 8 0 0116 0v6"/></svg>' +
    '<div class="src" id="s12-s0" style="left:28px;top:26px">' + AC.svg("doc", 32) + '</div>' +
    '<div class="src" id="s12-s1" style="left:28px;top:112px">' + AC.svg("youtube", 32) + '</div>' +

    '<div class="tf" id="s12-tf">tus fuentes</div>';

  // insignias y tarjeta del modulo

  for (let i = 0; i < 3; i++) stage.appendChild(mk('<div class="ac-glass badge" id="s12-bd' + i + '" style="top:' + BADGE_Y[i] + 'px;border-color:' + ACC[i] + ';box-shadow: 0px 16px 34px rgba(0,0,0,0.28), 0 0 40px rgba(255,255,255,.07),inset 0 1px 0 rgba(255,255,255,.45)"><span>' + (i + 1) + '</span></div>'));
  stage.appendChild(mk('<div class="ac-glass mod" id="s12-mod" data-layout-allow-overlap>' +
    '<svg class="fold" id="s12-fold" viewBox="0 0 48 48"></svg>' +
    '<div class="tag" id="s12-tag"><span class="w">Módulo</span> <span class="w">2</span></div>' +

    '<div class="ml" id="s12-m2" style="top:330px"><i class="dot"></i><span class="w">Crear tu primera clase</span></div>' +
    '</div>'));
  // el path de carpeta: construir el svg correcto
  (function () {
    const f = document.getElementById("s12-fold");

  stage.appendChild(mk('<div class="sign"><div class="lockup" id="s12-lockup"><img src="assets/sn-app-icon.png" alt="SuprNotes"><span>SuprNotes</span></div><div class="sdiv" id="s12-sdiv"></div><img class="os" id="s12-os" src="assets/logo-white.png" alt="OneScreen"></div>'));

  // ---------- coreografia ----------

  const capIn = (i, t) => { tl.fromTo("#s12-cap" + i, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 1.1, ease: "power3.out" }, t); tl.to("#s12-b" + i, { opacity: .9, duration: 1.0, ease: "power2.out" }, t); };

  // bloom suave de fondo

  // titulo
  tl.set("#s12-t1", { opacity: 1 }, c("tres") - .15);
  tl.fromTo("#s12-t1 .w", { yPercent: 115 }, { yPercent: 0, duration: 1.1, ease: "power4.out", stagger: .14 }, c("tres") - .15);

  // IDEA 1 -----------------------------------------------------------
  const t1 = c("Supernotes") - .2;
  rise(0, t1); capIn(0, t1 + .5);
  const tSheet = c("contenido") - .15;
  tl.fromTo("#s12-sheet", { y: 36, opacity: 0, scale: .9 }, { y: 0, opacity: 1, scale: 1, duration: 1.1, ease: "power3.out" }, tSheet);
  tl.to("#s12-lab1", { opacity: 1, duration: .9, ease: "power2.out" }, tSheet + .4);
  const p1 = [158, 150, 205, 150, 235, 150, 288, 150];
  AC.link(tl, document.getElementById("s12-l1"), p1, c("en") - .05, 1.0, "#bcd6ff");
  AC.packet(tl, zones[0], p1, c("en") + .1, 1.0);
  tl.to("#s12-sheet", { opacity: .55, duration: 1.0, ease: "power2.inOut" }, c("en") + .5);
  tl.fromTo("#s12-sc1", { rotateY: -90, opacity: 0, x: -30 }, { rotateY: 0, opacity: 1, x: 0, duration: 1.3, ease: "expo.out" }, c("material") + .3);
  tl.fromTo("#s12-sc2", { x: -50, opacity: 0, rotate: 0 }, { x: 0, opacity: 1, rotate: 7, duration: 1.2, ease: "power3.out" }, c("estudio") + .05);
  tl.to("#s12-lab2", { opacity: 1, duration: .9, ease: "power2.out" }, c("estudio") + .35);

  // IDEA 2 -----------------------------------------------------------
  const t2 = c("Lo") - .15;
  rise(1, t2); capIn(1, t2 + .5);
  const tPar = c("paralelo") - .2;
  tl.fromTo("#s12-hub", { scale: .3, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.1, ease: "back.out(1.4)" }, tPar - .2);
  OUT.forEach((o, i) => {
    const y = 26 + i * 62, p = [80, 150, 125, 150, 125, y, 168, y];
    tl.fromTo("#s12-r" + i, { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 1.2, ease: "power3.out" }, tPar + .45 + i * .05);

    AC.packet(tl, zones[1], p, tPar + .5, 1.2);   // los cinco a la vez

    const t = c(o.w) - .08, sel = "#s12-r" + i;
    tl.to(sel + " .ic", { backgroundColor: o.c, color: "#fff", borderColor: "rgba(255,255,255,.7)", boxShadow: "0 0 26px " + o.c, duration: .8, ease: "power2.out" }, t);

    tl.fromTo(sel + " .ic svg", { scale: .7 }, { scale: 1, duration: 1.0, ease: "back.out(2)", transformOrigin: "50% 50%" }, t);

  // IDEA 3 -----------------------------------------------------------
  const t3 = c("Y") - .15;
  rise(2, t3); capIn(2, t3 + .5);
  tl.fromTo("#s12-shp", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.4, ease: "power2.inOut" }, c("solo") - .1);
  tl.to("#s12-shf", { opacity: 1, duration: 1.2, ease: "power2.out" }, c("solo") + .9);

  tl.fromTo("#s12-shf", { scale: 1 }, { scale: 1.06, duration: .6, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, tIn + 1.0);

  // importar: la flecha cae en la carpeta

  tl.fromTo("#s12-mlock", { x: 20, opacity: 0 }, { x: 0, opacity: 1, duration: 1.0, ease: "power3.out" }, tM + .6);

  window.__timelines["s12-cierre"] = tl;
})();
