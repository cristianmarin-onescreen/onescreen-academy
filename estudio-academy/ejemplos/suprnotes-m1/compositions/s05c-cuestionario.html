<script>
(function () {
  const S = "s05c-cuestionario", root = document.getElementById("s05ccuestionario"), wrap = document.getElementById("s05c-wrap");
  const D = AC.insDur(S), cu = (w) => AC.icue(S, "b05c", w);
  const OPTS = [
    { L: "A", t: "Produce su propio alimento con la luz del sol", y: 508, st: "no" },
    { L: "B", t: "Descompone los restos de plantas y animales", y: 604 },
    { L: "C", t: "Caza otras especies y regula sus poblaciones", y: 700, st: "ok" },
    { L: "D", t: "Vive solo en zonas protegidas por el hombre", y: 796 }
  ];
  const Q = "¿Qué papel cumple un depredador en el ecosistema?";
  document.getElementById("s05c-q").innerHTML = Q.split(" ").map((w) => '<span class="w">' + w + "</span>").join(" ");
  OPTS.forEach((o, i) => {
    const d = document.createElement("div"); d.className = "s05c-opt" + (o.st ? " " + o.st : ""); d.id = "s05c-o" + i; d.style.top = o.y + "px";
    const stI = o.st === "ok"
      ? '<svg viewBox="0 0 48 48" stroke="#fff"><path id="s05c-ck" d="M10 25l9 9 19-20" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>'
      : o.st === "no" ? '<svg viewBox="0 0 48 48" stroke="#ff9aaa">' + AC.ICON.equis + "</svg>" : "";
    d.innerHTML = '<div class="hl"></div><div class="bd ac-lbl">' + o.L + '</div><div class="tx">' + o.t + '</div><div class="st">' + stI + "</div>";
    wrap.appendChild(d);
  });
  // confeti de luz (semilla fija)
  const rnd = AC.seeded(505), CF = [], COL = ["#16b8e8", "#7df0ff", "#ffffff", "#a9c8ff", "#3976ff"];
  for (let i = 0; i < 34; i++) {
    const e = document.createElement("div"); e.className = "s05c-cf"; e.style.background = COL[i % COL.length];
    if (i % 3 === 0) { e.style.borderRadius = "50%"; e.style.boxShadow = " 0 0 12px 3px rgba(255,255,255,.07)"; }
    root.appendChild(e); CF.push({ e, a: rnd() * Math.PI * 2, r: 120 + rnd() * 150, rot: (rnd() - .5) * 720 });
  }

  const tl = gsap.timeline({ paused: true });
  const tCue = cu("cuestionario"), tPreg = cu("Preguntas"), tComp = cu("comprobar"), tVer = cu("verdad"), tEnt = cu("entendio");

  // fondo: deriva lineal muy lenta durante todo el inserto
  tl.fromTo("#s05c-grid", { x: 0, y: 0 }, { x: 50, y: 50, duration: D, ease: "none" }, 0);
  tl.fromTo("#s05c-tint", { scale: .95 }, { scale: 1.05, duration: D, ease: "none" }, 0);

  // "cuestionario": titulo y tarjeta de vidrio con cabecera y filas vacias
  const t0 = Math.max(tCue, .03);
  AC.line(tl, "#s05c-t", t0, null);
  tl.fromTo("#s05c-card", { y: 120, rotateX: 30, opacity: 0, scale: .92 }, { y: 0, rotateX: 0, opacity: 1, scale: 1, duration: 1.3, ease: "expo.out", transformPerspective: 1400 }, t0);
  tl.fromTo("#s05c-hd", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: .9, ease: "power2.out" }, .45);
  OPTS.forEach((o, i) => tl.fromTo("#s05c-o" + i, { y: 40, opacity: 0, rotateX: -25 }, { y: 0, opacity: 1, rotateX: 0, duration: 1.0, ease: "expo.out", transformPerspective: 900 }, .5 + i * .14));

  // "Preguntas": se escribe la pregunta y despues el texto de las opciones en cascada suave
  tl.fromTo("#s05c-q .w", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: .9, ease: "expo.out", stagger: .07 }, tPreg);
  OPTS.forEach((o, i) => tl.fromTo("#s05c-o" + i + " .tx", { x: -36, opacity: 0 }, { x: 0, opacity: 1, duration: .9, ease: "expo.out" }, tPreg + .55 + i * .14));

  // "comprobar": el cursor llega, A falla (tiembla suave, ✗); luego C acierta
  const P = { A: [880, 552], C: [1060, 746] };
  tl.set("#s05c-cur", { x: 1200, y: 470 }, 0);
  tl.to("#s05c-cur", { opacity: 1, duration: .4, ease: "power2.out" }, tComp - .2);
  tl.to("#s05c-cur", { x: P.A[0], y: P.A[1], duration: .85, ease: "power2.inOut" }, tComp - .1);
  const tA = tComp + .8;   // clic en A (~2.56)
  tl.to("#s05c-cur", { scale: .85, duration: .12, ease: "power2.in", transformOrigin: "10% 10%" }, tA - .1);
  tl.to("#s05c-cur", { scale: 1, duration: .25, ease: "power2.out" }, tA + .02);
  tl.fromTo("#s05c-rip", { x: P.A[0], y: P.A[1], scale: .5, opacity: .9 }, { scale: 4.5, opacity: 0, duration: .8, ease: "power2.out", immediateRender: false }, tA);
  tl.to("#s05c-o0 .hl", { opacity: 1, duration: .3, ease: "power2.out" }, tA);
  tl.fromTo("#s05c-o0 .st", { opacity: 0, scale: .4, rotate: -30 }, { opacity: 1, scale: 1, rotate: 0, duration: .6, ease: "expo.out", immediateRender: false }, tA + .05);
  tl.fromTo("#s05c-o0", { x: 0 }, { keyframes: { x: [0, -12, 10, -7, 4, 0] }, duration: .7, ease: "power2.out", immediateRender: false }, tA + .05);
  tl.to("#s05c-o0 .hl", { opacity: .5, duration: .8, ease: "power2.inOut" }, tA + .8);
  tl.to("#s05c-o0", { opacity: .85, duration: .8, ease: "power2.inOut" }, tA + .8);
  // hacia C
  const tC = tVer + .15;   // clic en C
  tl.to("#s05c-cur", { x: P.C[0], y: P.C[1], duration: .95, ease: "power2.inOut" }, tA + .35);
  tl.to("#s05c-cur", { scale: .85, duration: .12, ease: "power2.in", transformOrigin: "10% 10%" }, tC - .05);
  tl.to("#s05c-cur", { scale: 1, duration: .25, ease: "power2.out" }, tC + .07);
  tl.fromTo("#s05c-rip", { x: P.C[0], y: P.C[1], scale: .5, opacity: .9 }, { scale: 5, opacity: 0, duration: .9, ease: "power2.out", immediateRender: false }, tC + .02);

  // la correcta se ilumina con calma: check y destello
  const tOk = tC + .08;
  tl.to("#s05c-o2 .hl", { opacity: 1, duration: .6, ease: "power2.out" }, tOk);
  tl.fromTo("#s05c-o2", { scale: 1 }, { scale: 1.03, duration: .9, ease: "expo.out", immediateRender: false }, tOk);
  tl.to("#s05c-o2 .st", { opacity: 1, duration: .2 }, tOk);
  tl.to("#s05c-ck", { strokeDashoffset: 0, duration: .6, ease: "power2.out" }, tOk + .05);
  tl.fromTo("#s05c-flash", { scale: .6, opacity: 1 }, { scale: 1.5, opacity: 0, duration: 1.0, ease: "power2.out", immediateRender: false }, tOk);
  tl.to("#s05c-tint", { opacity: 1, duration: .8, ease: "power2.out" }, tOk);
  tl.to("#s05c-o1, #s05c-o3", { opacity: .8, duration: .8, ease: "power2.inOut" }, tOk + .2);
  tl.fromTo("#s05c-d2", { scale: 1 }, { scale: 1.25, duration: .7, ease: "expo.out", immediateRender: false }, tOk + .3);
  tl.set("#s05c-d2", { className: "s05c-dot on" }, tOk + .3);
  tl.to("#s05c-cur", { opacity: 0, duration: .6, ease: "power2.in" }, tOk + .5);

  // "entendio": la tarjeta cede espacio, el anillo se llena despacio y cuenta, confeti de luz
  const tS = tEnt - .48;
  tl.to("#s05c-wrap", { x: -250, duration: 1.2, ease: "power2.inOut" }, tS);
  tl.fromTo("#s05c-score", { x: 120, opacity: 0, rotateY: -35, scale: .9 }, { x: 0, opacity: 1, rotateY: 0, scale: 1, duration: 1.2, ease: "expo.out", transformPerspective: 1400, immediateRender: false }, tS + .2);
  const T0 = tS + .4, TF = 1.15, cnt = { v: 0 };
  tl.to("#s05c-arc", { strokeDashoffset: .2, duration: TF, ease: "power2.inOut" }, T0);
  tl.to(cnt, { v: 8, duration: TF, ease: "power2.inOut", onUpdate: () => { document.getElementById("s05c-n").textContent = Math.round(cnt.v); } }, T0);
  tl.fromTo("#s05c-ft", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: .8, ease: "expo.out", immediateRender: false }, T0 + .6);
  CF.forEach((c) => {
    const tt = T0 + TF - .35, dx = Math.cos(c.a) * c.r * 1.1, dy = Math.sin(c.a) * c.r * .9;
    tl.fromTo(c.e, { x: 0, y: 0, opacity: 1, scale: .4, rotation: 0 }, { x: dx, y: dy, scale: 1, rotation: c.rot, duration: 1.0, ease: "expo.out", immediateRender: false }, tt);
    tl.to(c.e, { opacity: 0, duration: .4, ease: "power1.in" }, tt + .5);
  });
  tl.fromTo("#s05c-score", { boxShadow: " 0px 16px 34px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,.45), 0 0 0 rgba(22,184,232,0)" }, { boxShadow: " 0px 16px 34px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,.45), 0 0 60px rgba(255,255,255,.07)", duration: 1.0, ease: "power2.out", immediateRender: false }, T0 + TF - .5);

  window.__timelines["s05c-cuestionario"] = tl;
})();
</script>
