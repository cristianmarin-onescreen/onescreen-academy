    if (n > 1) tl.to("#s08-ss" + (n - 1), { opacity: 0, y: -8, duration: .4, ease: "power2.in" }, t - .3);
    tl.fromTo("#s08-ss" + n, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .9, ease: "power3.out" }, t + .2);
  };
  // 'sus ejemplos': el hilo sale de la clase y llega a las dos primeras piezas
  sub(1, T.ejem - .25);
  draw("#s08-bv", T.ejem - .2, 1.0); draw("#s08-bh1", T.ejem + .6, 1.2); draw("#s08-bd2", T.ejem + 1.7, .5, "power2.out");
  packetPoly(g34, [[360, 385], [360, 508], [760, 508], [760, 548]], T.ejem + .1, 1.7);
  // 'su forma de explicar': el hilo sigue a las otras dos
  sub(2, T.forma - .1);
  draw("#s08-bh2", T.forma, 1.4); draw("#s08-bd3", T.forma + .55, .5, "power2.out"); draw("#s08-bd4", T.forma + 1.3, .5, "power2.out");
  packetPoly(g34, [[760, 508], [1160, 508], [1160, 548]], T.forma + .1, 1.2);
  packetPoly(g34, [[760, 508], [1560, 508], [1560, 548]], T.forma + .3, 1.6);
  // 'ella fue la fuente': la fuente se ilumina y las cuatro piezas se calientan
  sub(3, T.fuente);
  tl.to("#s08-src", { borderColor: "rgba(255,190,150,.95)", boxShadow: " 0 0 60px 6px rgba(255,255,255,.07), 0px 16px 34px rgba(0,0,0,0.28)", duration: 1.2, ease: "power2.out" }, T.fuente);
  [1, 2, 3, 4].forEach((n, k) => tl.to("#s08-p" + n, { boxShadow: " 0 0 56px 6px rgba(255,255,255,.07), 0px 16px 34px rgba(0,0,0,0.28)", duration: 1.2, ease: "power2.out" }, T.fuente + .1 + k * .12));

  /* ====== BEAT 5: ya no pasa la noche armando material ====== */
  const OUTT = T.ya;
  tl.to("#s08-g34", { opacity: 0, scale: .97, transformOrigin: "50% 50%", duration: 1.0, ease: "power2.inOut" }, OUTT - .1);
  tl.to(["#s08-src", "#s08-bus"], { opacity: 0, duration: 1.0, ease: "power2.inOut" }, OUTT - .1);
  tl.fromTo("#s08-sw", { opacity: 0, y: 30, scale: .94 }, { opacity: 1, y: 0, scale: 1, duration: 1.4, ease: "power3.out" }, T.noche - .35);
  tl.fromTo("#s08-moon", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 1.3, ease: "power3.out" }, T.noche - .1);
  tl.fromTo("#s08-stars i", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.out", stagger: .06 }, T.noche);
  // amanecer (en 'material')
  const SUN = T.mat + .05;
  tl.to("#s08docente .day", { opacity: 1, duration: 1.6, ease: "power2.inOut" }, SUN);
  tl.to("#s08-moon", { y: 150, opacity: 0, duration: 1.3, ease: "power2.inOut" }, SUN);
  tl.to("#s08-stars i", { opacity: 0, duration: 1.0, ease: "power2.inOut" }, SUN);
  tl.fromTo("#s08-sun", { y: 230 }, { y: 0, duration: 1.7, ease: "power2.out" }, SUN + .1);
  tl.to("#s08-au2", { opacity: 1, duration: 1.8, ease: "power2.out" }, SUN);
  tl.fromTo("#s08-sl2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 1.1, ease: "power3.out" }, SUN + 1.0);

  // revisa, ajusta, comparte: tres verbos con check
  [["Revisa", T.rev], ["ajusta", T.aju], ["comparte", T.cpt]].forEach((v, i) => {
    const t = v[1] - .1, dur = i === 2 ? 1.05 : 1.2;
    tl.fromTo("#s08-v" + i, { opacity: 0, y: 34, scale: .96 }, { opacity: 1, y: 0, scale: 1, duration: dur, ease: "power3.out" }, t);
    tl.to("#s08-v" + i + " .vk", { backgroundColor: "#7df0ff", borderColor: "#7df0ff", boxShadow: " 0 0 24px rgba(255,255,255,.07)", duration: .7, ease: "power2.out" }, t + .45);
    tl.to("#s08-v" + i + " .vk path", { strokeDashoffset: 0, duration: .7, ease: "power2.out" }, t + .5);
    tl.to("#s08-v" + i + " .vk svg", { stroke: "#0c2a96", duration: .01 }, t + .5);
  });
  tl.to("#s08-rail-on", { strokeDashoffset: 0, duration: 1.8, ease: "power2.inOut" }, T.rev);

  window.__timelines["s08-docente"] = tl;
})();
</script>
