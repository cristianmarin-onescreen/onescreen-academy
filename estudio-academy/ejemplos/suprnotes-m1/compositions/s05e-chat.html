<script>
(function () {
  const ID = "s05e-chat", B = "b05e", root = document.getElementById("s05echat"), links = document.getElementById("s05e-links");
  const c = (w, n) => AC.icue(ID, B, w, n || 0);
  const SPARK = '<svg viewBox="0 0 48 48"><path d="M24 4l4.6 15.4L44 24l-15.4 4.6L24 44l-4.6-15.4L4 24l15.4-4.6z"/></svg>';
  ["s05e-hav", "s05e-gav", "s05e-aav"].forEach((i) => (document.getElementById(i).innerHTML = SPARK));
  document.getElementById("s05e-dtile").innerHTML = AC.svg("doc", 34);
  document.getElementById("s05e-chip").innerHTML = AC.svg("doc", 24) + "<span>Fuente: tu clase</span>";
  document.getElementById("s05e-cap").innerHTML = AC.svg("escudo", 30) + "<span>La IA responde solo con tu clase</span>";
  document.getElementById("s05e-send").innerHTML = '<svg class="ac-ico" viewBox="0 0 48 48"><path d="M10 24h26M25 12l12 12-12 12"/></svg>';

  // respuesta por palabras
  const ANS = "Porque controla a sus presas: evita que crezcan sin límite y mantiene el equilibrio del ecosistema.";
  const ab = document.getElementById("s05e-ab");
  ab.innerHTML = ANS.split(" ").map((w) => '<span class="s05e-aw">' + w + "</span>").join(" ");

  // red de la IA (semilla fija)
  const rnd = AC.seeded(23), CX = 450, CY = 250, net = document.getElementById("s05e-net"), ai = document.getElementById("s05e-ai");
  const NS = "http://www.w3.org/2000/svg", N = 6, pts = [];
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2 + (rnd() - .5) * .45 + .3, r = .8 + rnd() * .3;
    pts.push({ x: CX + Math.cos(a) * 330 * r, y: CY + Math.sin(a) * 200 * r });
  }
  const lines = [];
  const mk = (x1, y1, x2, y2, op, w) => {
    const l = document.createElementNS(NS, "path"); l.setAttribute("d", "M" + x1 + " " + y1 + " L" + x2 + " " + y2);
    l.setAttribute("stroke", "#ffd3e7"); l.setAttribute("stroke-width", w); l.setAttribute("stroke-linecap", "round"); l.setAttribute("fill", "none");
    l.setAttribute("pathLength", "1"); l.setAttribute("stroke-dasharray", "1"); l.setAttribute("stroke-dashoffset", "1"); l.setAttribute("opacity", op);
    net.appendChild(l); lines.push(l); return l;
  };
  pts.forEach((p) => mk(CX, CY, p.x, p.y, ".75", "2.5"));
  pts.forEach((p, i) => mk(p.x, p.y, pts[(i + 1) % N].x, pts[(i + 1) % N].y, ".32", "2"));
  const nodes = pts.map((p, i) => { const d = document.createElement("div"); d.className = "s05e-node"; d.style.left = p.x + "px"; d.style.top = p.y + "px"; ai.appendChild(d); return d; });

  const tl = gsap.timeline({ paused: true });
  const D = 7.295;

  // fondo: derivas lentas (tambien sutiles hasta el ultimo cuadro)
  tl.fromTo("#s05e-grid", { x: 0, y: 0 }, { x: 140, y: 140, duration: D, ease: "none" }, 0);
  tl.fromTo("#s05e-og1", { x: 0, y: 0 }, { x: -110, y: 50, duration: D, ease: "sine.inOut" }, 0);
  tl.fromTo("#s05e-og2", { x: 0, y: 0 }, { x: 110, y: -40, duration: D, ease: "sine.inOut" }, 0);

  // ---- "chat": la ventana de vidrio se levanta y el titulo sube palabra por palabra
  tl.fromTo("#s05e-win", { y: 90, opacity: 0, rotateX: -22, scale: .93, transformPerspective: 1500 }, { y: 0, opacity: 1, rotateX: 0, scale: 1, duration: 1.3, ease: "expo.out" }, .04);
  [["s05e-w0", "chat"], ["s05e-w1", "con"], ["s05e-w2", "inteligencia"], ["s05e-w3", "artificial"]].forEach(([id, w]) => {
    tl.fromTo("#" + id, { yPercent: 170 }, { yPercent: 0, duration: .9, ease: "expo.out" }, Math.max(.06, c(w) - .06));
  });

  // ---- "inteligencia": nace la IA; "artificial": se tiende su red (simple)
  const t1 = c("inteligencia") - .04, t2 = c("artificial") - .04;
  tl.fromTo("#s05e-big", { scale: .2, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.1, ease: "expo.out" }, t1);
  tl.fromTo("#s05e-r1", { scale: .5, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.0, ease: "expo.out" }, t1 + .15);
  tl.fromTo("#s05e-r2", { scale: .5, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.1, ease: "expo.out" }, t1 + .3);
  tl.to("#s05e-r1", { rotation: 120, duration: 1.6, ease: "none" }, t1 + .15);
  tl.to("#s05e-r2", { rotation: -100, duration: 1.6, ease: "none" }, t1 + .3);
  tl.fromTo("#s05e-bur", { scale: 1, opacity: 0 }, { opacity: .8, duration: .05 }, t2);
  tl.to("#s05e-bur", { scale: 2.6, opacity: 0, duration: 1.3, ease: "power2.out" }, t2 + .05);
  nodes.forEach((n, i) => tl.fromTo(n, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: .6, ease: "expo.out" }, t2 + .1 + i * .07));
  lines.forEach((l, i) => tl.to(l, { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, t2 + .05 + (i < N ? i * .07 : .35 + (i - N) * .05)));

  // ---- "Una conversacion": la IA viaja al encabezado y entra el saludo
  const tc = c("conversación") - .05, tf = c("Una") - .22;
  tl.to(lines, { opacity: 0, duration: .5, ease: "power2.inOut" }, tf);
  tl.to(nodes, { opacity: 0, scale: 0, duration: .5, ease: "power2.inOut" }, tf);
  tl.to(["#s05e-r1", "#s05e-r2"], { opacity: 0, scale: .4, duration: .6, ease: "power2.inOut" }, tf);
  tl.to("#s05e-big", { x: -394, y: -292, scale: .32, duration: 1.0, ease: "power2.inOut" }, tf);
  tl.to("#s05e-big", { opacity: 0, duration: .2 }, tf + .85);
  tl.fromTo("#s05e-hav", { scale: .3, opacity: 0 }, { scale: 1, opacity: 1, duration: .6, ease: "expo.out" }, tf + .85);
  tl.fromTo("#s05e-gav", { scale: .3, opacity: 0 }, { scale: 1, opacity: 1, duration: .7, ease: "expo.out" }, tc);
  tl.fromTo("#s05e-g", { y: 24, x: -30, opacity: 0, scale: .92, transformOrigin: "0% 0%" }, { y: 0, x: 0, opacity: 1, scale: 1, duration: 1.0, ease: "expo.out" }, tc);
  tl.fromTo("#s05e-s1", { y: 26, x: 36, opacity: 0, scale: .92, transformOrigin: "100% 0%" }, { y: 0, x: 0, opacity: 1, scale: 1, duration: .9, ease: "expo.out" }, tc + .55);

  // ---- "sobre ese mismo contenido": el documento, luego los hilos, luego el sello
  const ts = c("sobre") + .05, te = c("ese") + .02, tk = c("contenido") - .02;
  tl.to("#s05e-win", { x: 350, duration: 1.3, ease: "power2.inOut" }, ts);
  tl.fromTo("#s05e-doc", { x: -240, opacity: 0, rotateY: 55, scale: .92, transformPerspective: 1300 }, { x: 0, opacity: 1, rotateY: 0, scale: 1, duration: 1.4, ease: "expo.out" }, ts + .1);
  const PORTS = [[600, 392, 860, 430], [600, 592, 860, 604], [600, 770, 860, 730]];
  PORTS.forEach((p, i) => {
    const path = [p[0], p[1], p[0] + 110, p[1], p[2] - 110, p[3], p[2], p[3]];
    AC.link(tl, links, path, te + .35 + i * .18, 1.0, "#7df0ff", "s05e-th" + i);
    [[p[0], p[1]], [p[2], p[3]]].forEach((e, k) => {
