  <div class="ac-glass s05b-mom" id="s05b-m1" style="top:570px"><div class="ic" id="s05b-m1i"></div><div class="ac-lbl">En la espera</div></div>

<script>
(function () {
  const S = "s05b-tarjetas", root = document.getElementById("s05btarjetas");
  const grp = document.getElementById("s05b-grp");
  const D = AC.insDur(S);
  const cue = (w, n) => AC.icue(S, "b05b", w, n);

  // ---------- tarjetas ----------
  const CARDS = [
    { q: ["¿Qué", "es", "un", "ecosistema?"], a: ["Seres", "vivos", "y", "su", "entorno,", "conectados", "entre", "sí."], sm: 0 },
    { q: ["¿Qué", "es", "un", "depredador?"] },
    { q: ["¿Qué", "es", "una", "especie", "en", "peligro?"], sm: 1 },
    { q: ["¿Para", "qué", "sirve", "conservar?"] },
    { q: ["¿Qué", "es", "una", "cadena", "trófica?"] },
    { q: ["¿Qué", "come", "un", "carnívoro?"] }
  ];
  const wrap = (ws, extra) => ws.map((w, i) => '<span class="w">' + w + "</span>").join(" ");
  const cards = CARDS.map((c, i) => {
    const el = document.createElement("div"); el.className = "s05b-card"; el.id = "s05b-c" + i;
    const ck = '<div class="s05b-ck">' + AC.svg("check", 36) + "</div>";
    let h = '<div class="ac-glass s05b-f" data-layout-allow-overlap><div class="s05b-wm">?</div><div class="s05b-in" data-layout-allow-overlap><div class="s05b-tag">' + AC.svg("tarjetas", 30) + 'Pregunta</div>' +
      '<div class="s05b-q' + (c.sm ? " sm" : "") + '">' + wrap(c.q) + '</div><div class="s05b-hint">' + (i === 0 ? "Voltea para ver la respuesta" : "Piensa antes de voltear") + "</div></div>" + (i ? ck : "") + "</div>";
    if (c.a) h += '<div class="ac-glass s05b-f bk" data-layout-allow-overlap><div class="s05b-in" data-layout-allow-overlap><div class="s05b-tag">' + AC.svg("check", 30) + 'Respuesta</div><div class="s05b-q sm" id="s05b-ans">' +
      '<span class="w">Seres</span> <span class="w"><em>vivos</em></span> <span class="w">y</span> <span class="w">su</span> <span class="w"><em>entorno</em>,</span> <span class="w">conectados</span> <span class="w">entre</span> <span class="w">sí.</span>' +
      '</div><div class="s05b-hint">Breve: una sola idea</div></div>' + ck + "</div>";
    el.innerHTML = h; grp.appendChild(el); return el;
  });
  const front = (i) => "#s05b-c" + i + " > .s05b-f:not(.bk) > .s05b-in";

  // posiciones: abanico inicial y pila (d = profundidad)
  const R = 760, ANG = [18, 6, -6, -18, -30, 30];
  const fanPose = (i) => { const a = ANG[i] * Math.PI / 180; return { x: R * Math.sin(a), y: R * (1 - Math.cos(a)) - 60, rotation: ANG[i], z: 0, scale: 1, rotateY: 0 }; };
  const P = [
    { x: 0, y: 0, rotation: 0, z: 0 }, { x: 34, y: -26, rotation: 3, z: -90 }, { x: -30, y: -46, rotation: -3.5, z: -180 },
    { x: 40, y: -62, rotation: 5, z: -270 }, { x: -34, y: -74, rotation: 4, z: -330 }, { x: 10, y: -80, rotation: -1, z: -360 }
  ];
  const ZI = (d) => 20 - d;

  const tl = gsap.timeline({ paused: true });

  // fondo: rejilla en deriva lenta (una sola direccion, sin vaiven)
  tl.fromTo("#s05b-grid", { x: 0, y: 0 }, { x: 120, y: 120, duration: D, ease: "none" }, 0);

  // ---------- t0: entra el abanico (lento) ----------
  cards.forEach((el, i) => {
    tl.set(el, { zIndex: 10 + [5, 4, 3, 2, 1, 0][i] }, 0);
    tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: .8, ease: "power2.out" }, i * .04);
  });

  // ---------- "preguntas": una tarjeta sube al frente con su pregunta ----------
  const tP = cue("preguntas");
  AC.line(tl, "#s05b-t1", tP - .02, null);
  cards.forEach((el, i) => {
    const to = Object.assign({}, P[i]);
    if (i === 0) to.scale = 1.1;
    tl.set(el, { zIndex: ZI(i) + (i === 0 ? 5 : 0) }, tP);
    tl.fromTo(el, Object.assign({}, fanPose(i), { scale: 1 }), Object.assign({ duration: 1.3, ease: "power2.inOut" }, to), tP + (i === 0 ? 0 : .05 * i));
  });
  tl.fromTo(front(0), { opacity: 0 }, { opacity: 1, duration: .6, ease: "power2.out" }, tP + .55);
  tl.fromTo("#s05b-c0 .s05b-f:not(.bk) .s05b-q .w", { yPercent: 90, opacity: 0 }, { yPercent: 0, opacity: 1, duration: .8, ease: "power3.out", stagger: .1 }, tP + .55);
  tl.fromTo("#s05b-c0 .s05b-wm", { scale: .6, opacity: 0 }, { scale: 1, opacity: 1, duration: 1, ease: "expo.out", transformOrigin: "100% 0%" }, tP + .55);

  // ---------- "respuestas": la tarjeta se voltea (1.5 s) ----------
  const tR = cue("respuestas");
  tl.to("#s05b-c0", { rotateY: 180, duration: 1.5, ease: "power2.inOut" }, tR);
  tl.to("#s05b-c0", { scale: 1.18, duration: .75, ease: "power2.out", yoyo: true, repeat: 1 }, tR);
  tl.to(front(0), { opacity: 0, duration: .01 }, tR + .75);
  tl.fromTo("#s05b-c0 .bk .s05b-in", { opacity: 0 }, { opacity: 1, duration: .6, ease: "power2.out" }, tR + .75);
  tl.fromTo("#s05b-ans .w", { yPercent: 90, opacity: 0 }, { yPercent: 0, opacity: 1, duration: .8, ease: "power3.out", stagger: .09 }, tR + .85);

  // ---------- "breves": las palabras clave de la respuesta brillan ----------
  const tB = cue("breves");
  tl.fromTo("#s05b-ans em", { filter: "drop-shadow(0 0 0px rgba(255,255,255,.07)))" }, { filter: "drop-shadow(0 0 16px rgba(255,255,255,.07)))", duration: .8, ease: "power2.inOut", yoyo: true, repeat: 1, stagger: .3 }, tB + .9);

  // ---------- "memorizar": el concepto se ancla en la memoria ----------
  const tM = cue("memorizar"), tC = cue("conceptos");
  tl.to(grp, { x: -330, duration: 1.3, ease: "power2.inOut" }, tM - .1);
  tl.set("#s05b-mem", { opacity: 1 }, tM - .01);
  const bn = document.getElementById("s05b-brain"); bn.innerHTML = AC.svg("cerebro", 130);
  const bp = bn.querySelectorAll("svg path"); bp.forEach((p) => { p.setAttribute("pathLength", "1"); p.setAttribute("stroke-dasharray", "1"); p.setAttribute("stroke-dashoffset", "1"); });
  tl.fromTo("#s05b-brain", { scale: .5, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.2, ease: "expo.out" }, tM + .3);
  tl.to(bp, { strokeDashoffset: 0, duration: 1.2, ease: "power2.inOut", stagger: .12 }, tM + .5);
  ["w1", "w2"].forEach((id, k) => {
    tl.fromTo("#s05b-" + id, { scale: 1, opacity: .8 }, { scale: 2.1, opacity: 0, duration: 1.6, ease: "power2.out" }, tM + .8 + k * .6);
  });
  tl.fromTo("#s05b-mast", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: .9, ease: "power2.out" }, tM + 1.0);
  tl.to("#s05b-fill", { scaleX: .94, duration: 1.8, ease: "power2.inOut" }, tM + 1.1);
  const pc = { v: 0 };
  tl.to(pc, { v: 94, duration: 1.8, ease: "power2.inOut", onUpdate: () => { document.getElementById("s05b-pc").textContent = Math.round(pc.v) + " %"; } }, tM + 1.1);

  // "conceptos": tres conceptos se enlazan al cerebro, uno a uno
  [0, 1, 2].forEach((k) => {
    const t = tC + k * .4, y = 490 + k * 100, p = [1370, 590, 1420, 590, 1430, y, 1480, y];
    tl.fromTo("#s05b-cc" + k, { x: -50, scale: .7, opacity: 0 }, { x: 0, scale: 1, opacity: 1, duration: 1, ease: "expo.out" }, t);
    AC.link(tl, document.getElementById("s05b-mlinks"), p, t - .05, .8, "#7df0ff");
  });
  tl.to("#s05b-mem", { opacity: 0, duration: .7, ease: "power2.inOut" }, 4.3);

  // ---------- "ideales ... repasar": dos tarjetas dominadas, lentas ----------
  const SW = [3.7, 4.38];
  SW.forEach((ts, k) => {
    const sel = "#s05b-c" + k;
    tl.fromTo(sel + " .s05b-ck", { scale: .3, opacity: 0 }, { scale: 1, opacity: 1, duration: .5, ease: "back.out(2)" }, ts - .3);
    tl.to(sel, { x: "-=70", y: "-=70", rotation: -4, duration: 1.2, ease: "power2.inOut" }, ts);
    tl.to(sel + " .s05b-f", { opacity: 0, duration: .7, ease: "power2.in" }, ts + .2);
    tl.set(sel, { zIndex: 1 }, ts + 1.25);
    CARDS.forEach((c, j) => {
      if (j <= k) return;
      const d = j - k - 1, ps = P[Math.min(d, 5)];
