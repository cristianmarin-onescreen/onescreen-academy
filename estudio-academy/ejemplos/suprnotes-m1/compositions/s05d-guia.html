<script>
(function () {
  const S = "s05d-guia";
  const c = (w, n) => AC.icue(S, "b05d", w, n);
  const $ = (id) => document.getElementById(id);
  const STAR = '<svg class="st" viewBox="0 0 24 24"><path d="M12 1.5l3 6.9 7.4.7-5.6 4.9 1.7 7.3L12 17.6l-6.5 3.7 1.7-7.3L1.6 9.1l7.4-.7z"/></svg>';

  // ---- iconos
  $("s05d-hic").innerHTML = AC.svg("guia", 52);
  $("s05d-cic").innerHTML = AC.svg("calendario", 38);
  $("s05d-tg1").innerHTML = AC.svg("doc", 22) + "DEFINICIONES";
  $("s05d-tg2").innerHTML = STAR.replace('class="st"', 'style="fill:#ffc4ae"') + "PUNTOS CLAVE";
  $("s05d-evt").innerHTML = AC.svg("escudo", 30).replace("<svg", '<svg style="display:none"') + "Evaluación";
  $("s05d-evt").innerHTML = '<svg viewBox="0 0 48 48" class="ac-ico"><path d="M12 6v38M12 8h26l-6 8 6 8H12"/></svg>Evaluación';

  // ---- glosario
  const EN = [
    { t: "Depredador",         a: "animal que", k: "caza",        z: " a otros para alimentarse" },
    { t: "Ecosistema",         a: "seres vivos que ", k: "dependen", z: " unos de otros" },
    { t: "Especie en peligro", a: "población con riesgo de ", k: "desaparecer", z: "" },
    { t: "Conservación",       a: "cuidar y ", k: "proteger",        z: " la naturaleza" }
  ];
  const ens = $("s05d-ens");
  EN.forEach((e, i) => {
    const d = document.createElement("div"); d.className = "en"; d.id = "s05d-e" + i; d.style.top = (206 + 108 * i) + "px";
    d.innerHTML = '<div class="slot"></div><div class="row"><i class="bar"></i><div class="t">' + e.t + '</div><div class="d">' + e.a +
      '<span class="hl"><span class="m"></span><b>' + e.k + '</b></span>' + e.z + '</div>' + STAR + '</div>';
    ens.appendChild(d);
  });

  // ---- fragmentos de luz (definiciones sueltas)
  const R = AC.seeded(55);
  const FR = [ { x: 330, y: 330 }, { x: 1590, y: 360 }, { x: 330, y: 730 }, { x: 1590, y: 740 } ];
  const frs = $("s05d-frs");
  FR.forEach((f, i) => {
    const d = document.createElement("div"); d.className = "ac-glass fr"; d.id = "s05d-f" + i; d.setAttribute("data-layout-allow-overlap", ""); d.setAttribute("data-layout-allow-occlusion", "");
    d.style.left = (f.x - 150) + "px"; d.style.top = (f.y - 31) + "px";
    d.innerHTML = EN[i].t + "<span>: …</span>"; frs.appendChild(d);
    f.rot = (R() - .5) * 14;
  });

  // ---- calendario: 2 filas, 8..21 (lunes a domingo)
  const gridEl = $("s05d-grid"), GX = 36, GY = 160;
  ["L", "M", "M", "J", "V", "S", "D"].forEach((l, i) => {
    const w = document.createElement("div"); w.className = "wd"; w.style.left = (GX + i * 58) + "px"; w.textContent = l; gridEl.appendChild(w);
  });
  const pos = (day) => { const k = day - 8; return { x: GX + (k % 7) * 58, y: GY + Math.floor(k / 7) * 56 }; };
  for (let d = 8; d <= 21; d++) {
    const p = pos(d), e = document.createElement("div"); e.className = "cell"; e.id = "s05d-c" + d; e.style.left = p.x + "px"; e.style.top = p.y + "px";
    e.innerHTML = '<div class="tr"></div><div class="ev"></div><span>' + d + '</span>'; gridEl.appendChild(e);
  }
  const p15 = pos(15);
  $("s05d-ring").style.left = p15.x + "px"; $("s05d-ring").style.top = p15.y + "px";
  const odo = $("s05d-odo");
  for (let n = 3; n >= 1; n--) { const e = document.createElement("div"); e.className = "nm"; e.id = "s05d-n" + n; e.textContent = n; odo.appendChild(e); }

  // ---- tiempos (locales al inserto): la voz manda, el resto respira
  const cDoc = c("documento"), cRe = c("reúne"), cDef = c("definiciones"), cPun = c("puntos"), cCla = c("clave"),
        cPen = c("pensado"), cMom = c("momento"), cPre = c("previo"), cEva = c("evaluación");
  const tl = gsap.timeline({ paused: true });
  const P3 = 1800;

  // fondo: aura magenta nace con el documento
  tl.fromTo("#s05d-aura", { opacity: 0, scale: .7 }, { opacity: .85, scale: 1, duration: 1.6, ease: "power2.out" }, cDoc - .1);

  // 1) "documento": la hoja de vidrio entra en 3D, sin prisa
  tl.fromTo("#s05d-wrap", { opacity: 0, scale: .7, y: 60, rotateX: 20, rotateY: -30, transformPerspective: P3 },
                          { opacity: 1, scale: 1, y: 0, rotateX: 6, rotateY: -8, transformPerspective: P3, duration: 1.3, ease: "expo.out" }, cDoc - .1);
  tl.fromTo("#s05d-gh1", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 1.1, ease: "power2.out" }, cDoc + .3);
  tl.fromTo("#s05d-gh2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 1.1, ease: "power2.out" }, cDoc + .4);
  tl.fromTo("#s05d-hic", { scale: 0, rotate: -30 }, { scale: 1, rotate: 0, duration: .9, ease: "expo.out" }, cDoc + .35);
  tl.fromTo("#s05d-ht", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: .9, ease: "expo.out" }, cDoc + .5);
  tl.fromTo("#s05d-hs", { opacity: 0, x: -20 }, { opacity: .95, x: 0, duration: .9, ease: "expo.out" }, cDoc + .65);
  tl.to("#s05d-rule", { scaleX: 1, duration: 1.1, ease: "power2.inOut" }, cDoc + .7);
  EN.forEach((e, i) => tl.fromTo("#s05d-e" + i + " .slot", { opacity: 0 }, { opacity: 1, duration: .8, ease: "power2.out" }, cDoc + .9 + i * .1));

  // 2) "reúne": la hoja se endereza y las definiciones sueltas llegan una a una
  tl.to("#s05d-wrap", { rotateX: 0, rotateY: 0, duration: 1.2, ease: "power2.inOut" }, cRe);
  FR.forEach((f, i) => {
    const t0 = cRe + i * .2, fl = 1.1, tx = 610 + 150, ty = 170 + 206 + 108 * i + 48;
    const sx = f.x, sy = f.y, sg = sx < tx ? 1 : -1;
    const p = [sx, sy, sx + (tx - sx) * .12, sy - 110, tx - sg * 190, ty - 80, tx, ty];
    const sel = "#s05d-f" + i, el = $("s05d-f" + i), pr = { t: 0 };
    tl.fromTo(sel, { opacity: 0, scale: .6, rotate: f.rot }, { opacity: 1, scale: 1, duration: .6, ease: "power2.out" }, t0 - .1);
    tl.to(pr, { t: 1, duration: fl, ease: "power2.inOut", onUpdate: () => { const b = AC.bez(p, pr.t); el.style.left = (b.x - 150) + "px"; el.style.top = (b.y - 31) + "px"; } }, t0 + .15);
    tl.to(sel, { rotate: 0, duration: fl, ease: "power2.inOut" }, t0 + .15);
    for (let k = 1; k <= 2; k++) AC.packet(tl, $("s05dguia"), p, t0 + .15 + k * .07, fl, "power2.inOut");
    const L = t0 + .15 + fl;
    tl.to(sel, { opacity: 0, scale: .94, duration: .35, ease: "power2.in" }, L - .12);
    tl.to("#s05d-e" + i + " .slot", { opacity: 0, duration: .4, ease: "power2.in" }, L - .1);
    tl.fromTo("#s05d-e" + i + " .row", { opacity: 0, scale: 1.04, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: .6, ease: "power2.out" }, L - .15);
    tl.fromTo("#s05d-e" + i + " .bar", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: .5, ease: "power2.out" }, L - .1);
  });
  tl.fromTo("#s05d-tg1", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: .8, ease: "expo.out" }, cDef);

  // 3) "puntos clave": el marcador se dibuja despacio, una entrada cada ~0.4 s, y se lee
  tl.fromTo("#s05d-tg2", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: .8, ease: "expo.out" }, cPun);
  const hit = (i, t) => {
    tl.fromTo("#s05d-e" + i + " .m", { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power2.inOut" }, t);
    tl.fromTo("#s05d-e" + i + " svg.st", { scale: 0, rotate: -60, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, rotate: 0, opacity: 1, duration: .8, ease: "expo.out" }, t + .8);
  };
  hit(0, cPun + .1); hit(1, cCla + .05); hit(2, cPen - .3); hit(3, cPen + .1);

  // 4) "momento previo a una evaluación": la hoja cede el centro, el calendario entra con calma
  tl.to("#s05d-wrap", { x: -250, scale: .96, rotateY: 6, duration: 1.4, ease: "power2.inOut" }, cMom - .05);
  tl.to("#s05d-aura", { x: -220, duration: 1.4, ease: "power2.inOut" }, cMom - .05);
