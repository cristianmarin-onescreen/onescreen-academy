    d.style.left = (o.x - o.w / 2) + "px"; d.style.top = (o.y - o.h / 2) + "px"; d.style.width = o.w + "px"; d.style.height = o.h + "px";

  /* ---------------- beat 3: tarjeta del monton, personas, fichas fantasma ---------------- */
  $("#s02-tok").innerHTML = '<div class="ac-glass l b2"></div><div class="ac-glass l b1"></div><div class="ac-glass l f"><div style="color:#a9c8ff">' + AC.svg("carpeta", 92) + '</div><div class="ac-lbl">Todo lo que se explicó</div><div class="ac-sub">sin ordenar</div></div>';

  const GH = [ { k: "resumen", t: "Un resumen", ya: 400 }, { k: "tarjetas", t: "Tarjetas", ya: 600 }, { k: "cuest", t: "Un cuestionario", ya: 800 } ];
  const BW = [100, 86, 62];

    d.innerHTML = '<div class="ac-glass gf"></div><div class="ic">' + AC.svg(g.k, 50) + '</div><div class="tx"><div class="ac-lbl">' + g.t + '</div>' +
      BW.map((w) => '<div class="tr" style="width:' + w + '%"><i></i></div>').join("") + '</div><div class="sw"></div>';
  });

  /* ---------------- beat 4: reloj + odometro ---------------- */
  const clk = $("#s02-clk"), NS = "http://www.w3.org/2000/svg";
  const mk = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); clk.appendChild(e); return e; };

  const hH = mk("line", { x1: 165, y1: 165, x2: 165, y2: 100, stroke: "#fff", "stroke-width": 9, "stroke-linecap": "round" });
  const hM = mk("line", { x1: 165, y1: 165, x2: 165, y2: 56, stroke: "#cfe2ff", "stroke-width": 6, "stroke-linecap": "round" });

  const strips = odo.querySelectorAll(".st");

  const pos = (v, step, win) => { const f = Math.floor(v / step), r = v - f * step; return f + smooth((r - (step - win)) / win); };
  const pr = { T: 0 };
  function setT() {
    const T = Math.max(0, pr.T);
    strips[1].style.transform = "translateY(" + (-pos(T, 60, 10) * 84) + "px)";

  /* ======================== LINEA DE TIEMPO ======================== */
  const tl = gsap.timeline({ paused: true });
  const C = (w, n) => AC.cue(S, "b02", w, n || 0);

  ITEMS.forEach((o, i) => {
    const t = C(o.c[0], o.c[1]) + o.c[2] - .05, s = "#s02-it" + i;
    const dx = (R() - .5) * 140, dy = 90 + R() * 50;
    tl.fromTo(s, { opacity: 0, z: -620, x: dx, y: dy, scale: .68, rotateX: 34, rotateZ: o.r * 3 }, { opacity: 1, z: o.z, x: 0, y: 0, scale: 1, rotateX: 0, rotateZ: o.r, duration: 1.4, ease: "power3.out" }, t);

  ITEMS.forEach((o, i) => {

  // personas que van a repasar (a la derecha, sobre las fichas)
  PPL_X.forEach((x, i) => tl.fromTo("#s02-p" + i, { opacity: 0, y: -30, scale: .7 }, { opacity: 1, y: 0, scale: 1, duration: 1.1, ease: "back.out(1.4)" }, cPers + i * .3));

  // tres fichas fantasma; cada una trae su trazo de luz desde el montón
  const lks = [];
  [cRes, cTar, cCue].forEach((t, i) => {
    const yi = GH[i].ya, p = [500, 560, 820, 560, 860, yi, 1150, yi];
    tl.fromTo("#s02-g" + i, { opacity: 0, x: 90, rotateY: -32 }, { opacity: 1, x: 0, rotateY: 0, duration: 1.3, ease: "power3.out" }, t - .1);
    lks.push(AC.link(tl, $("#s02-lk"), p, t + .2, 1.4, "#a9c8ff"));
    AC.packet(tl, root, p, t + .45, 1.3, "power2.inOut");
  });
  lks.forEach((e) => tl.to(e, { attr: { opacity: 0 }, duration: .8, ease: "power2.inOut" }, cHac - .45));

  // --- beat 4: «hacerlo a mano toma horas»
  tl.to("#s02-tok", { opacity: 0, x: -40, scale: .92, duration: 1.2, ease: "power2.inOut" }, cHac + .2);
  tl.fromTo("#s02-cg", { opacity: 0, scale: .78, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 1.4, ease: "power3.out" }, cHac - .05);
  tl.to(pr, { T: 270, duration: 2.3, ease: "power2.inOut", onUpdate: setT }, cHac + .95);

  // las fichas se llenan despacio y torpes (pasos), la última se queda corta
  const bar = (g, b) => "#s02-g" + g + " .tr:nth-of-type(" + (b + 2) + ") i";
  const fill = (g, b, a, t, d, to, st) => tl.to(bar(g, b), { scaleX: to, duration: d, ease: "steps(" + st + ")" }, t);
  const f0 = cHac + .95;
  fill(0, 0, 0, f0, .7, 1, 4); fill(0, 1, 0, f0 + .5, .6, 1, 4); fill(0, 2, 0, f0 + .9, .6, 1, 3);
  fill(1, 0, 0, f0 + .6, .7, 1, 5); fill(1, 1, 0, f0 + 1.15, .7, 1, 4); fill(1, 2, 0, f0 + 1.65, .7, 1, 4);
  fill(2, 0, 0, f0 + 1.5, .9, .55, 4); fill(2, 1, 0, f0 + 2.05, .35, .16, 2);
  tl.to("#s02-g0 .gf", { opacity: 1, duration: .9, ease: "power2.out" }, f0 + 1.5);
  tl.to("#s02-g0", { borderColor: "rgba(255,255,255,.35)", duration: .9 }, f0 + 1.5);
  tl.to("#s02-g1 .gf", { opacity: 1, duration: .9, ease: "power2.out" }, f0 + 2.15);
  tl.to("#s02-g1", { borderColor: "rgba(255,255,255,.35)", duration: .9 }, f0 + 2.15);
  [0, 1].forEach((g) => tl.to("#s02-g" + g + " .ic", { backgroundColor: "rgba(255,255,255,.2)", color: "#fff", duration: .7 }, f0 + 1.7 + g * .65));

  // «casi siempre se queda a medias»: lista de verificación 2/3 y tinte ámbar sutil
  tl.fromTo("#s02-chk", { opacity: 0, x: -50, rotateY: 30 }, { opacity: 1, x: 0, rotateY: 0, duration: 1.3, ease: "power3.out" }, cCasi - .15);
  const ck = (i, t) => {
    tl.to("#s02-r" + i + " .fl", { opacity: 1, duration: .5, ease: "power2.out" }, t);
    tl.to("#s02-r" + i + " .bx", { borderColor: "#e59a52", duration: .5 }, t);
    tl.to("#s02-r" + i + " svg path", { strokeDashoffset: 0, duration: .8, ease: "power2.inOut" }, t + .15);
  };
  ck(0, cCasi + .4); ck(1, cCasi + 1.05);
  tl.to("#s02-r2 .bx", { scale: 1.16, duration: .7, ease: "power2.inOut", yoyo: true, repeat: 1 }, cMed - .1);
  tl.to("#s02-amb", { opacity: 1, duration: 1.8, ease: "power2.inOut" }, cHoras - .2);
  tl.to("#s02-amb", { scale: 1.12, duration: 1.2, ease: "power2.inOut" }, cMed - .1);
  tl.to(ring, { attr: { stroke: "#ffc58a" }, duration: 1.4, ease: "power2.inOut" }, cHoras - .2);
  tl.to(hM, { attr: { stroke: "#ffd9b0" }, duration: 1.4 }, cHoras - .2);
  tl.to("#s02-odo", { color: "#ffd9b0", duration: 1.4 }, cHoras - .2);
  tl.to("#s02-face", { backgroundColor: "rgba(255,160,70,.24)", duration: 1.6 }, cHoras - .2);
  tl.to("#s02-g2", { borderColor: "rgba(255,200,140,.8)", duration: 1.2, ease: "power2.inOut" }, cMed);

  // --- beat 5: «SuprNotes existe para resolver justo eso»
  tl.to("#s02-halo", { opacity: 1, duration: 1.6, ease: "power2.out" }, cSup);
  tl.set("#s02-lock", { opacity: 1 }, cSup - .01);
  tl.fromTo("#s02-lkic", { scale: .55, opacity: 0, y: 24, rotate: -8 }, { scale: 1, opacity: 1, y: 0, rotate: 0, duration: 1.5, ease: "back.out(1.25)" }, cSup);
  tl.fromTo("#s02-lkflash", { scale: 1, opacity: .9 }, { scale: 1.9, opacity: 0, duration: 1.5, ease: "power2.out" }, cSup + .35);
  tl.fromTo("#s02-lkw", { clipPath: "inset(0 100% 0 0)", x: -30, opacity: 0 }, { clipPath: "inset(0 0% 0 0)", x: 0, opacity: 1, duration: 1.4, ease: "power3.out" }, cSup + .5);
  // el reloj se contrae y se vuelve «minutos»
  tl.to("#s02-cg", { scale: .74, duration: 1.5, ease: "power2.inOut" }, cSup + .1);
  tl.to(pr, { T: 2, duration: 1.5, ease: "power2.inOut", onUpdate: setT }, cSup + .1);
  tl.to("#s02-amb", { opacity: 0, duration: 1.2, ease: "power2.inOut" }, cSup + .1);
  tl.to("#s02-cool", { opacity: 1, duration: 1.4, ease: "power2.inOut" }, cSup + .3);
  tl.to(ring, { attr: { stroke: "#7df0ff" }, duration: 1.2, ease: "power2.inOut" }, cSup + .2);
  tl.to(hM, { attr: { stroke: "#7df0ff" }, duration: 1.2 }, cSup + .2);
  tl.to("#s02-odo", { color: "#ffffff", duration: 1.2 }, cSup + .2);
  tl.to("#s02-face", { backgroundColor: "rgba(255,255,255,0)", duration: 1.2 }, cSup + .2);
  tl.to("#s02-cap1", { opacity: 0, duration: .8 }, cSup + .7);
  tl.to("#s02-cap2", { opacity: 1, duration: .9 }, cSup + 1.0);

  // las fichas se llenan solas con luz azul (una tras otra, con barrido)
  const lightUp = (g, t) => {
    const sel = "#s02-g" + g;
    tl.fromTo(sel + " .sw", { x: -200, opacity: 1 }, { x: 760, duration: 1.4, ease: "power2.inOut" }, t);
    tl.set(sel + " .sw", { opacity: 0 }, t + 1.45);
    tl.to(sel + " .tr i", { scaleX: 1, backgroundColor: "#7df0ff", duration: 1.3, ease: "power2.inOut", stagger: .2 }, t);
    tl.to(sel + " .gf", { opacity: 1, duration: 1, ease: "power2.out" }, t);
    tl.to(sel, { borderStyle: "solid", borderColor: "rgba(255,255,255,.8)", boxShadow: " 0 0 46px 6px rgba(255,255,255,.07)", duration: 1.2, ease: "power2.out" }, t + .2);
    tl.to(sel + " .ic", { backgroundColor: "#3976ff", color: "#fff", duration: .9 }, t + .3);
  };
  lightUp(0, cExi - .15); lightUp(1, cExi + .35); lightUp(2, cExi + .85);
  [0, 1, 2].forEach((i) => tl.to("#s02-p" + i, { color: "#7df0ff", boxShadow: " 0 0 36px 4px rgba(255,255,255,.07)", duration: 1.2, ease: "power2.out" }, cExi + .9 + i * .2));
  // la última casilla por fin se marca
  const t3 = cExi + 1.5;
  tl.to("#s02-r2 .bx", { borderColor: "#3976ff", borderStyle: "solid", duration: .5 }, t3);
  tl.to("#s02-r2 .fl", { opacity: 1, duration: .6, ease: "power2.out" }, t3);
  tl.to("#s02-r2 svg path", { strokeDashoffset: 0, duration: .9, ease: "power2.inOut" }, t3 + .15);
  tl.to("#s02-n2", { opacity: 0, duration: .6 }, t3);
  tl.to("#s02-n3", { opacity: 1, duration: .8 }, t3 + .1);

  window.__timelines["s02-problema"] = tl;
})();
</script>
</template>
