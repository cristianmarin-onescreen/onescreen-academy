    box-shadow:  0px 16px 34px rgba(0,0,0,0.28), 0 0 60px rgba(255,255,255,.07), inset 0 1px 0 rgba(255,255,255,.5); }

  #s05aresumen .s05a-hd .ac-lbl { font-size: 31px; }

  #s05aresumen .s05a-rt { font-family: "Manrope"; font-weight: 700; font-size: 30px; letter-spacing: -.01em; white-space: nowrap; }
  #s05aresumen .s05a-ck { margin-left: auto; color: #7df0ff; opacity: 0; display: grid; place-items: center; }
  #s05aresumen .s05a-brain { position: absolute; right: -50px; bottom: -50px; width: 118px; height: 118px; border-radius: 50%; display: grid; place-items: center; opacity: 0; color: #fff;
    background: radial-gradient(circle at 36% 30%, #bdd1ff, #5c8dff 62%, #2d63e2); border: 3px solid rgba(255,255,255,.7); box-shadow:  0 0 50px 6px rgba(255,255,255,.07); }
  #s05aresumen .s05a-brainring { position: absolute; right: -50px; bottom: -50px; width: 118px; height: 118px; border-radius: 50%; border: 3px solid #7df0ff; opacity: 0; }

  /* panel de contraste 45 -> 2 */
  #s05aresumen .s05a-panel { left: 1100px; top: 220px; width: 660px; height: 640px; opacity: 0; border-color: rgba(125,240,255,.45); }
  #s05aresumen .s05a-eye { position: absolute; left: 100px; top: 60px; width: 90px; height: 90px; border-radius: 26px; display: grid; place-items: center; background: rgba(255,255,255,.14); color: rgba(255,255,255,.85); }
  #s05aresumen .s05a-eye svg.sl { position: absolute; inset: 0; width: 90px; height: 90px; overflow: visible; }
  #s05aresumen .s05a-old { position: absolute; left: 218px; top: 44px; font-family: "Rubik"; font-weight: 700; font-size: 112px; letter-spacing: -.045em; line-height: 1; color: #fff; white-space: nowrap; }
  #s05aresumen .s05a-strike { position: absolute; left: 206px; top: 104px; width: 350px; height: 9px; border-radius: 5px; background: #ff5fa8; box-shadow:  0 0 18px rgba(255,255,255,.07); transform-origin: 0 50%; transform: scaleX(0); }
  #s05aresumen .s05a-cap1 { position: absolute; left: 100px; top: 170px; width: 460px; font-family: "Manrope"; font-weight: 700; font-size: 25px; opacity: .78; }
  #s05aresumen .s05a-arrow { position: absolute; left: 280px; top: 222px; width: 100px; height: 118px; overflow: visible; }
  #s05aresumen .s05a-new { position: absolute; left: 0; width: 660px; top: 350px; text-align: center; opacity: 0; }
  #s05aresumen .s05a-new .big { font-family: "Rubik"; font-weight: 700; font-size: 176px; letter-spacing: -.05em; line-height: 1.12; color: #bcd0ff; text-shadow:  0 0 40px rgba(255,255,255,.07), 0 0 60px rgba(255,255,255,.07); }
  #s05aresumen .s05a-new .cap { font-family: "Manrope"; font-weight: 800; font-size: 28px; margin-top: 10px; color: #fff; }
</style>

<div id="s05aresumen" class="ac-root" data-composition-id="s05a-resumen" data-width="1920" data-height="1080">
  <div class="s05a-bg"></div><div class="s05a-grid"></div>
  <div class="s05a-bloom" id="s05a-bloom" data-layout-allow-overflow></div><div class="s05a-bloom2" id="s05a-bloom2"></div>
  <div class="s05a-vig"></div>

  <div class="ac-glass s05a-chip" id="s05a-chip"><span id="s05a-clk"></span><div><div class="ac-lbl">45 min</div><div class="ac-sub">clase de biología</div></div></div>

  <div class="s05a-core" id="s05a-core">
    <div class="s05a-ring" id="s05a-ring0"></div><div class="s05a-ring" id="s05a-ring1"></div><div class="s05a-ring" id="s05a-ring2"></div>
    <div class="s05a-orb" id="s05a-orb"></div><div class="s05a-flash" id="s05a-flash"></div>
  </div>

  <div class="ac-glass s05a-card" id="s05a-card">
    <div class="s05a-shinewrap"><div class="s05a-shine" id="s05a-shine" data-layout-allow-overflow></div></div>
    <div class="s05a-hd"><div class="s05a-hico" id="s05a-hico"></div><div class="ac-lbl">Resumen de guía</div><div class="s05a-tag" id="s05a-tag">Clase de biología</div></div>
    <div class="s05a-ttl" id="s05a-ttl">Los depredadores</div>
    <div class="s05a-ul" id="s05a-ul"></div>
    <div class="s05a-row" data-layout-allow-overlap data-layout-allow-occlusion id="s05a-r0" style="top:232px"><div class="s05a-num">1</div><div class="s05a-rt">Cazan para alimentarse</div><div class="s05a-ck"></div></div>
    <div class="s05a-row" data-layout-allow-overlap data-layout-allow-occlusion id="s05a-r1" style="top:326px"><div class="s05a-num">2</div><div class="s05a-rt">Controlan el número de presas</div><div class="s05a-ck"></div></div>
    <div class="s05a-row" data-layout-allow-overlap data-layout-allow-occlusion id="s05a-r2" style="top:420px"><div class="s05a-num">3</div><div class="s05a-rt">Equilibran el ecosistema</div><div class="s05a-ck"></div></div>
    <div class="s05a-row" data-layout-allow-overlap data-layout-allow-occlusion id="s05a-r3" style="top:514px"><div class="s05a-num">4</div><div class="s05a-rt">Muchas especies están en peligro</div><div class="s05a-ck"></div></div>
    <div class="s05a-brainring" id="s05a-brainring"></div>
    <div class="s05a-brain" id="s05a-brain"></div>
  </div>

  <div class="ac-glass s05a-panel" id="s05a-panel">
    <div class="s05a-eye" id="s05a-eye"><svg class="sl" viewBox="0 0 90 90"><path id="s05a-slash" d="M10 80 L80 10" fill="none" stroke="#ff5fa8" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg></div>

    <svg class="s05a-arrow" viewBox="0 0 100 118"><path id="s05a-arrow" d="M50 4 V108 M22 82 L50 112 L78 82" fill="none" stroke="#a6c1ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>

  </div>
</div>

<script>
(function () {
  const ID = "s05a-resumen", root = document.getElementById("s05aresumen");
  const T = (w, n) => AC.icue(ID, "b05a", w, n);
  const tl = gsap.timeline({ paused: true });
  const rnd = AC.seeded(11);
  const $ = (s) => document.getElementById(s);

  // iconos
  $("s05a-clk").innerHTML = AC.svg("reloj", 52);
  $("s05a-hico").innerHTML = AC.svg("resumen", 36);
  $("s05a-brain").innerHTML = AC.svg("cerebro", 62);
  $("s05a-eye").insertAdjacentHTML("afterbegin", AC.svg("ojo", 58));
  document.querySelectorAll("#s05a-card .s05a-ck").forEach((e) => (e.innerHTML = AC.svg("check", 36)));

  // ---- 1) la clase larga y desordenada: pila de paginas (0 - .55) ----
  const PG = [[520,430,-11],[700,650,7],[880,420,-5],[1060,660,12],[1240,440,8],[1420,650,-9],[380,640,10],[1540,450,-6],[800,545,3],[1130,540,-13],[960,610,6]];
  const WORDS = ["ecosistema","depredador","especie en peligro","conservación","presas","cadena alimentaria","hábitat","carnívoros"];
  const pages = [];
  PG.forEach((p, i) => {
    const d = document.createElement("div"); d.className = "s05a-pg"; d.setAttribute("data-layout-allow-overlap",""); d.setAttribute("data-layout-allow-occlusion",""); d.style.left = (p[0] - 120) + "px"; d.style.top = (p[1] - 155) + "px"; d.style.zIndex = 2 + i;
    let h = '<i class="h" style="width:' + (46 + Math.round(rnd() * 24)) + '%"></i>';
    const wordAt = 2 + (i % 4);
    for (let k = 0; k < 10; k++) {
      if (k === wordAt) h += "<b>" + WORDS[(i * 3 + 1) % WORDS.length] + "</b>";
      else h += '<i style="width:' + (k % 5 === 4 ? 40 + Math.round(rnd() * 20) : 78 + Math.round(rnd() * 22)) + '%"></i>';
    }
    d.innerHTML = h; root.appendChild(d); pages.push({ d, cx: p[0], cy: p[1], rot: p[2] });
  });
  pages.forEach((p, i) => { p.d.style.zIndex = 2 + i; });
  pages.forEach((p, i) => {
    tl.fromTo(p.d, { x: (rnd() - .5) * 300, y: (rnd() - .5) * 220, scale: .7, rotation: p.rot + (rnd() - .5) * 50, opacity: .3, transformPerspective: 900 },
      { x: 0, y: 0, scale: 1, rotation: p.rot, opacity: 1, duration: .7, ease: "power2.out" }, i * .02);
  });
  tl.fromTo("#s05a-chip", { y: -30, opacity: .3, scale: .94 }, { y: 0, opacity: 1, scale: 1, duration: .7, ease: "power2.out" }, .02);

  // ---- 2) "corta": todo se comprime despacio hacia el embudo ----
  const tC = T("corta");
  pages.forEach((p, i) => {
    const t = tC - .03 + i * .035, dir = i % 2 ? 1 : -1;
    tl.to(p.d, { x: 960 - p.cx, y: 540 - p.cy, scale: .1, rotation: p.rot + dir * 150, duration: 1.15, ease: "power2.inOut" }, t);
    tl.to(p.d, { opacity: 0, duration: .35, ease: "power1.in" }, t + .8);
  });
  tl.to("#s05a-chip", { y: 368, scale: .22, duration: 1.2, ease: "power2.inOut" }, tC - .03);
  tl.to("#s05a-chip", { opacity: 0, duration: .35, ease: "power1.in" }, tC + .85);
  // un solo anillo que se cierra
  const e0 = $("s05a-ring0"); e0.style.width = e0.style.height = "900px"; e0.style.left = e0.style.top = "-450px"; e0.style.border = "3px solid #8aadff";
  tl.fromTo(e0, { scale: 1.1, opacity: 0 }, { scale: .12, opacity: .6, duration: 1.4, ease: "power2.inOut" }, tC + .1);
  tl.to(e0, { opacity: 0, duration: .3 }, tC + 1.2);
  // particulas suaves
  const core = $("s05a-core");
  for (let i = 0; i < 16; i++) {
    const a = rnd() * Math.PI * 2, rr = 520 + rnd() * 460, d = document.createElement("div"); d.className = "s05a-dot"; core.appendChild(d);
    const st = tC + .1 + rnd() * .6;
    tl.fromTo(d, { x: Math.cos(a) * rr, y: Math.sin(a) * rr * .72, scale: 1.1 }, { x: 0, y: 0, scale: .35, duration: 1.0, ease: "power2.in" }, st);
    tl.to(d, { opacity: .85, duration: .25 }, st); tl.to(d, { opacity: 0, duration: .25 }, st + .8);
  }
  // el nucleo violeta crece y se disuelve en la tarjeta
  const tO = T("ordenada");
  tl.fromTo("#s05a-orb", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: .8, ease: "power2.out" }, tO - .3);
  tl.to("#s05a-orb", { scale: 3.2, opacity: 0, duration: 1.2, ease: "power2.out" }, tO + .5);
  tl.fromTo("#s05a-bloom", { opacity: 0, scale: .7 }, { opacity: .7, scale: 1, duration: 1.6, ease: "power2.out" }, tO + .3);

  // ---- 3) "ordenada": nace la tarjeta y los puntos se acomodan 1-2-3-4 ----
  tl.fromTo("#s05a-card", { scale: .3, opacity: 0, rotateX: 28, transformPerspective: 1500 }, { scale: 1, opacity: 1, rotateX: 0, duration: 1.3, ease: "expo.out" }, tO + .4);
  const PERM = [2, 0, 3, 1];
  [0, 1, 2, 3].forEach((i) => {
    const r = "#s05a-r" + i, t = tO + .75 + i * .2;
    tl.fromTo(r, { y: (PERM[i] - i) * 94, x: (i % 2 ? 30 : -30), rotation: (i % 2 ? 3 : -3) }, { y: 0, x: 0, rotation: 0, duration: 1.1, ease: "power3.out" }, t);
    tl.fromTo(r + " .s05a-num", { scale: .3, opacity: 0 }, { scale: 1, opacity: 1, duration: .7, ease: "back.out(1.8)", transformOrigin: "50% 50%" }, t + .6);
  });

  // ---- 4) "contenido": aparece la etiqueta de la clase ----
  const tCo = T("contenido");
  tl.fromTo("#s05a-tag", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 1.0, ease: "power2.out" }, tCo + .2);

  // ---- 5) "entender": el cerebro se enciende y cada punto se marca ----
  const tE = T("entender");
  tl.fromTo("#s05a-brain", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.1, ease: "back.out(1.5)" }, tE);
  tl.fromTo("#s05a-brainring", { scale: 1, opacity: .7 }, { scale: 2.2, opacity: 0, duration: 1.3, ease: "power2.out" }, tE + .3);
  [0, 1, 2, 3].forEach((i) => {
    const r = "#s05a-r" + i, t = tE + .4 + i * .3;
    tl.to(r, { backgroundColor: "rgba(92, 141, 255,.3)", borderColor: "rgba(175, 199, 255,.6)", duration: .8, ease: "power2.out" }, t);
    tl.fromTo(r + " .s05a-ck", { scale: .4, opacity: 0 }, { scale: 1, opacity: 1, duration: .8, ease: "power2.out" }, t);
  });

  // ---- 6) "trata": se subraya el tema ----
  const tT = T("trata");
  tl.to("#s05a-ul", { scaleX: 1, duration: 1.3, ease: "power2.inOut" }, tT - .05);

  // ---- 7) "volver ... verlo ... completo": contraste 45 min -> 2 min ----
  const tV = T("volver"), tL = T("verlo"), tF = T("completo");
  tl.to(["#s05a-card", "#s05a-bloom"], { x: -360, duration: 1.3, ease: "power2.inOut" }, tV - .08);
  tl.fromTo("#s05a-panel", { x: 100, opacity: 0, rotateY: -22, scale: .94, transformPerspective: 1500 }, { x: 0, opacity: 1, rotateY: 0, scale: 1, duration: 1.3, ease: "expo.out" }, tV + .05);
  tl.fromTo("#s05a-bloom2", { opacity: 0 }, { opacity: .8, duration: 1.4, ease: "power2.out" }, tV);
  tl.to("#s05a-slash", { strokeDashoffset: 0, duration: .6, ease: "power2.out" }, tL);
  tl.to("#s05a-strike", { scaleX: 1, duration: .7, ease: "power2.out" }, tL);
  tl.to(["#s05a-old", "#s05a-eye", "#s05a-cap1"], { opacity: .5, duration: .8, ease: "power2.out" }, tL + .3);
  tl.to("#s05a-arrow", { strokeDashoffset: 0, duration: .7, ease: "power2.inOut" }, tL + .35);
  tl.fromTo("#s05a-new", { scale: .8, opacity: 0, y: 14, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 1.1, ease: "expo.out" }, tF + .1);
  const cnt = { v: 45 };
  tl.fromTo(cnt, { v: 45 }, { v: 2, duration: 1.2, ease: "power2.out", onUpdate: () => { $("s05a-n").textContent = Math.round(cnt.v); } }, tF + .1);
  tl.fromTo("#s05a-bloom2", { scale: 1 }, { scale: 1.1, duration: 2.2, ease: "power1.inOut" }, tF + .1);

  tl.to({}, { duration: .01 }, AC.insDur(ID) - .01);
  window.__timelines["s05a-resumen"] = tl;
})();
</script>
</template>
</body>
</html>
