<script>
(function () {
  const S = "s04", B = "b04", D = AC.sceneDur(S);
  const $ = (id) => document.getElementById("s04-" + id);
  const c = (w, n) => AC.cue(S, B, w, n);
  const tl = gsap.timeline({ paused: true });
  const to = (t, v, at) => tl.to(t, Object.assign({ lazy: false }, v), at);
  const fr = (t, a, b, at) => tl.fromTo(t, a, Object.assign({ lazy: false }, b), at);

  // ---------- tiempos de la voz (locales) ----------
  const tHerr = c("herramienta"), tDe = c("de"), tNotas = c("notas"), tTrad = c("tradicional");
  const tEsc1 = c("escucha", 0), tEscribe = c("escribe"), tNada = c("nada");
  const tSuper = c("Supernotes"), tDa = c("da"), tUn = c("un"), tPaso = c("paso"), tAdic = c("adicional");
  const tEnt = c("entiende"), tEsc2 = c("escucha", 1), tVe = c("ve"), tDiap = c("diapositiva"), tEsq = c("esquema");
  const tCompr = c("comprende"), tCont = c("contexto"), tOrg = c("organiza");
  const tPers = c("persona"), tTiempo = c("tiempo"), tEstud = c("estudiarla");

  // ---------- titulos (palabra a palabra, en su cue) ----------
  const titles = $("titles");
  function mkTitle(id, cls, parts) {
    const ln = document.createElement("div"); ln.className = "ln " + (cls || ""); ln.id = "s04-" + id;
    ln.innerHTML = parts.map((p, i) => '<span class="w" id="s04-' + id + "-" + i + '">' + (p.em ? "<em>" + p.t + "</em>" : p.t) + "</span>").join(" ");
    titles.appendChild(ln); return ln;
  }
  function showTitle(id, parts) {   // parts: [{t, em, at}]
    tl.set("#s04-" + id, { opacity: 1 }, Math.max(0, parts[0].at - .06));
    parts.forEach((p, i) => fr("#s04-" + id + "-" + i, { yPercent: 170 }, { yPercent: 0, duration: 1.0, ease: "power3.out" }, p.at));
  }
  function hideTitle(id, n, at, dur) {
    const sel = []; for (let i = 0; i < n; i++) sel.push("#s04-" + id + "-" + i);
    to(sel, { yPercent: -170, duration: dur || .7, ease: "power3.in", stagger: .05 }, at);
    tl.set("#s04-" + id, { opacity: 0 }, at + (dur || .7) + .05 * n + .02);
  }
  const T1 = [{ t: "Herramienta", at: tHerr }, { t: "de", at: tDe }, { t: "notas", at: tNotas }, { t: "tradicional", em: 1, at: tTrad }];
  const T2 = [{ t: "SuprNotes", at: tSuper }, { t: "da", at: tDa }, { t: "un", at: tUn }, { t: "paso", at: tPaso }, { t: "adicional", em: 1, at: tAdic }];
  const T5 = [{ t: "Comprende", at: tCompr }, { t: "y", at: tCont }, { t: "organiza", em: 1, at: tOrg }];
  const T6 = [{ t: "Como", at: 17.5 }, { t: "una", at: 17.66 }, { t: "persona", at: tPers }, { t: "que", at: 18.38 }, { t: "la", at: 18.7 }, { t: "estudi&oacute;", em: 1, at: tEstud }];
  mkTitle("t1", "g", T1); mkTitle("t2", "", T2); mkTitle("t5", "", T5); mkTitle("t6", "", T6);

  // ---------- onda de audio (determinista: funcion del tiempo) ----------
  function mkBars(parent, n) { const a = []; for (let i = 0; i < n; i++) { const b = document.createElement("div"); b.className = "bar"; parent.appendChild(b); a.push(b); } return a; }
  function driveWave(bars, t0, t1, amp, fi) {
    const p = { t: 0 }, n = bars.length;
    tl.to(p, { t: 1, duration: t1 - t0, ease: "none", lazy: false, onUpdate: () => {
      const tt = t0 + p.t * (t1 - t0);
      const up = Math.min(1, (tt - t0) / .7), dn = Math.min(1, (t1 - tt) / .6);
      const ease = (x) => x * x * (3 - 2 * x), env = ease(Math.max(0, Math.min(up, dn)));
      for (let i = 0; i < n; i++) {
        const x = i / (n - 1), shape = .3 + .7 * Math.sin(Math.PI * x);
        const v = .25 + .75 * Math.abs(Math.sin(i * .62 + tt * 5.2 * fi) * Math.cos(i * .21 - tt * 2.6 * fi));
        bars[i].style.height = (6 + amp * env * shape * v) + "px";
      }
    } }, t0);
  }
  const w1 = mkBars($("w1"), 40), w3 = mkBars($("w3"), 60);

  // ---------- contenido estatico ----------
  const nb = $("nb");
  $("nbhd").innerHTML = AC.svg("texto", 38) + "<span>Transcripci&oacute;n</span>";
  const LINES = [["00:12", "los depredadores cazan para alimentarse"], ["00:19", "cuando desaparecen, el ecosistema cambia"], ["00:26", "algunas especies est&aacute;n en peligro"]];
  LINES.forEach((l, i) => { const r = document.createElement("div"); r.className = "row"; r.id = "s04-row" + i; r.style.top = (140 + i * 100) + "px"; r.innerHTML = "<b>" + l[0] + "</b><span>" + l[1] + "</span>"; nb.appendChild(r); });

  const EAR = '<svg class="ac-ico" viewBox="0 0 48 48" width="52" height="52"><path d="M14 23a10 10 0 0120 0c0 6-6 8-6 13a5 5 0 01-9.5 2.2"/><path d="M20 23a4 4 0 018 0c0 2.4-2.2 3.2-3.2 5"/></svg>';
  $("ear").innerHTML = '<div class="ic">' + EAR + '</div><div class="tx"><div class="ac-lbl">O&iacute;do</div><div class="ac-sub">lo que se escucha</div></div><div id="s04-w2"></div>';
  $("eye").innerHTML = '<div class="ic">' + AC.svg("ojo", 52) + '</div><div class="tx"><div class="ac-lbl">Ojo</div><div class="ac-sub">lo que se ve</div></div><div class="eyescan"><i style="width:92%"></i><i style="width:64%"></i><i style="width:80%"></i></div>';
  // reconstruir w2 (se acaba de recrear dentro de ear)
  const w2b = mkBars($("w2"), 28);
  $("play").innerHTML = AC.svg("video", 40);
  $("check").innerHTML = AC.svg("check", 44);

  // ---------- fichas de concepto ----------
  const board = $("board");
  const CH = [
    { k: "eco", t: "ecosistema", w: 290, hub: 1, o: [990, 409], m: [960, 560], l: [960, 332] },
    { k: "pla", t: "planta", w: 200, o: [1480, 403], m: [530, 420], l: [600 + 100, 520] },
    { k: "pre", t: "presa", w: 190, o: [1480, 531], m: [560, 730], l: [600 + 95, 610] },
    { k: "dep", t: "depredador", w: 280, o: [1480, 659], m: [960, 830], l: [600 + 140, 700] },
    { k: "esp", t: "especie en peligro", w: 410, o: [995, 562], m: [1400, 410], l: [980 + 205, 520] },
    { k: "con", t: "conservaci&oacute;n", w: 310, o: [995, 632], m: [1400, 730], l: [980 + 155, 610] }
  ];
  CH.forEach((h) => {
    const d = document.createElement("div"); d.className = "chip" + (h.hub ? " hub" : ""); d.id = "s04-c-" + h.k; d.style.width = h.w + "px";
    d.innerHTML = '<div class="ac-glass bg"></div><i class="dot"></i><span>' + h.t + "</span>";
    board.appendChild(d); gsap.set(d, { xPercent: -50, yPercent: -50 });
  });
  const CHD = {}; CH.forEach((h) => (CHD[h.k] = h));

  // =====================================================================
  // BEAT 1 — herramienta tradicional: escucha y escribe, nada mas (apagado)
  // =====================================================================
  showTitle("t1", T1);
  fr("#s04-nb", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 1.4, ease: "power3.out" }, tNotas - .1);
  fr("#s04-w1", { x: -50, opacity: 0 }, { x: 0, opacity: 1, duration: 1.4, ease: "power3.out" }, tNotas - .1);
  fr("#s04-w1cap", { opacity: 0 }, { opacity: .85, duration: 1.2, ease: "power2.out" }, tNotas + .4);
  // escucha: la onda se mueve y manda paquetes (grises) a la libreta
