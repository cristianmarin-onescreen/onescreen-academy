<script>
(function () {
  const S = "s03", $ = (s) => document.querySelector("#s03quees " + s), $$ = (s) => Array.from(document.querySelectorAll("#s03quees " + s));
  const tl = gsap.timeline({ paused: true });
  const D = AC.sceneDur(S);
  const c = (w, n) => AC.cue(S, "b03", w, n || 0);
  const rnd = AC.seeded(303);

  // ---- armado del DOM generado ----
  const TXT = "suprnotes.ai", chars = [];
  TXT.split("").forEach((ch) => { const s = document.createElement("span"); s.className = "c"; s.innerHTML = ch + "<i></i>"; $("#s03-ty").appendChild(s); chars.push(s); });
  const BARS = [20, 38, 60, 34, 72, 44, 26, 54, 30];
  BARS.forEach((h, i) => { const b = document.createElement("b"); b.style.height = h + "px"; b.style.left = (22 + i * 15) + "px"; b.style.top = ((100 - h) / 2 - 2) + "px"; $("#s03-o1").appendChild(b); });
  // sello festoneado
  (function () {
    let d = ""; const N = 160;
    for (let i = 0; i <= N; i++) { const a = i / N * Math.PI * 2, r = 74 + 4.5 * Math.cos(a * 16); d += (i ? "L" : "M") + (85 + r * Math.cos(a)).toFixed(2) + " " + (85 + r * Math.sin(a)).toFixed(2); }
    d += "Z"; $("#s03-sout").setAttribute("d", d); $("#s03-sfill").setAttribute("d", d);
  })();

  // ---- titulos: palabra por palabra en su momento ----
  function wordsAt(sel, times, tOut) {
    const ln = $(sel), ws = Array.from(ln.querySelectorAll(".w"));
    tl.set(ln, { opacity: 1 }, times[0] - 0.001);
    ws.forEach((w, i) => tl.fromTo(w, { yPercent: 170 }, { yPercent: 0, duration: 1.0, ease: "power3.out" }, times[i]));
    if (tOut != null) {
      tl.to(ws, { yPercent: -150, duration: .7, ease: "power2.in", stagger: .06 }, tOut);
      tl.set(ln, { opacity: 0 }, tOut + .7 + .06 * ws.length);
    }
  }
  wordsAt("#s03-tA", [c("una"), c("aplicación"), c("web")], 3.0);
  wordsAt("#s03-tB", [c("usa") - .05, c("inteligencia"), c("artificial")], 8.85);
  wordsAt("#s03-tC", [c("materiales"), c("de"), c("estudio"), c("estructurados")], null);

  // ---- ventana de vidrio flotando en 3D ----
  tl.fromTo("#s03-win", { opacity: 0, y: 90, scale: .93, rotateX: 38, transformPerspective: 1700, transformOrigin: "50% 100%" }, { opacity: 1, y: 0, scale: 1, rotateX: 0, duration: 1.5, ease: "expo.out" }, .05);
  // direccion que se escribe
  const t0 = .55, dt = .075;
  chars.forEach((ch, i) => {
    tl.set(ch, { opacity: 1 }, t0 + i * dt);
    tl.set(ch.querySelector("i"), { opacity: 1 }, t0 + i * dt);
    if (i < chars.length - 1) tl.set(ch.querySelector("i"), { opacity: 0 }, t0 + (i + 1) * dt);
  });
  tl.set(chars[chars.length - 1].querySelector("i"), { opacity: 0 }, 1.9);
  // carga de la pagina
  tl.set("#s03-load", { opacity: 1 }, 1.5);
  tl.to("#s03-load", { scaleX: 1, duration: 1.1, ease: "power2.inOut" }, 1.5);
  tl.to("#s03-load", { opacity: 0, duration: .6, ease: "power2.out" }, 2.75);
  tl.to("#s03-page", { opacity: 1, duration: 1.2, ease: "power2.out" }, 1.9);
  // firma discreta
  tl.fromTo("#s03-by", { x: -16, opacity: 0 }, { x: 0, opacity: 1, duration: 1.0, ease: "power3.out" }, c("desarrollada"));
  tl.fromTo("#s03-logo", { x: 14, opacity: 0, scale: .92, transformOrigin: "0 50%" }, { x: 0, opacity: 1, scale: 1, duration: 1.1, ease: "power3.out" }, c("OneScreen") - .05);

  // ---- lockup oficial como protagonista ----
  tl.fromTo("#s03-lockup", { opacity: 0, scale: .86, y: 26, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, y: 0, duration: 1.5, ease: "power3.out" }, c("SuprNotes") + .3);
  tl.to("#s03-lockup", { opacity: 0, scale: 1.05, y: -22, duration: 1.0, ease: "power2.in" }, 3.0);

  // ---- prisma / lente de IA ----
  const tp = c("inteligencia") - .06;
  tl.to("#s03-pout", { strokeDashoffset: 0, duration: 1.3, ease: "power2.inOut" }, tp);
  tl.to("#s03-pin", { strokeDashoffset: 0, duration: 1.3, ease: "power2.inOut" }, tp + .35);
  tl.to("#s03-pfill", { opacity: 1, duration: 1.2, ease: "power2.out" }, tp + .8);
  tl.fromTo("#s03-halo", { opacity: 0, scale: .55 }, { opacity: .75, scale: 1, duration: 1.5, ease: "expo.out" }, tp + 1.0);
  tl.fromTo("#s03-ia", { opacity: 0, scale: .6 }, { opacity: 1, scale: 1, duration: 1.1, ease: "power3.out", transformOrigin: "50% 50%" }, c("artificial") + .15);

  // ---- embudo: haces de entrada y salida ----
  const LANE = [430, 600, 770];
  const FACE = [[802, 530], [762, 615], [723, 700]];
  const OUTF = [[858, 530], [898, 615], [937, 700]];
  const ANCH = [[1200, 410], [1200, 623], [1200, 809]];
  const COL = ["#a9d4ff", "#7dffe0", "#ffa0c8"];
  const RGB = [[169, 212, 255], [125, 255, 224], [255, 160, 200]];
  const beams = $("#s03-beams"), tc = c("convertir") - .05;
  const inB = [], outB = [];
  LANE.forEach((y, i) => {
    const e = AC.link(tl, beams, [452, y, 560, y, FACE[i][0] - 120, FACE[i][1], FACE[i][0], FACE[i][1]], tc + i * .12, 1.4, COL[i]);
    e.style.color = COL[i]; e.style.opacity = .55; inB.push(e);
  });
  ANCH.forEach((a, i) => {
    const e = AC.link(tl, beams, [OUTF[i][0], OUTF[i][1], OUTF[i][0] + 150, OUTF[i][1], a[0] - 150, a[1], a[0], a[1]], c("contenido") + .25 + i * .12, 1.4, COL[i]);
    e.style.color = COL[i]; e.style.opacity = .3; outB.push(e);
  });
  // hoja futura: contorno que se dibuja en "educativo"
  tl.to("#s03-ghost", { strokeDashoffset: 0, duration: 1.5, ease: "power2.inOut" }, c("educativo") - .35);
  tl.set("#s03-ghost", { opacity: 1 }, 0);

  // ---- entradas: cada objeto en su palabra ----
  const ent = (id, lid, word) => {
    const t = c(word) - .05;
    tl.fromTo(id, { x: -130, opacity: 0, rotateY: 60, transformPerspective: 900 }, { x: 0, opacity: 1, rotateY: 0, duration: 1.1, ease: "power3.out" }, t);
    tl.to(lid, { opacity: 1, duration: .7, ease: "power2.out" }, t + .55);
    return t;
  };
  const tDoc = ent("#s03-o0", "#s03-l0", "documentos");
  tl.to("#s03-o0 .dl", { strokeDashoffset: 0, duration: .9, ease: "power2.inOut", stagger: .14 }, tDoc + .5);
  const tAud = ent("#s03-o1", "#s03-l1", "audios");
  tl.fromTo("#s03-o1 b", { scaleY: .1 }, { scaleY: 1, duration: 1.0, ease: "power3.out", stagger: .06 }, tAud + .4);
  const tVid = ent("#s03-o2", "#s03-l2", "videos");
  tl.fromTo("#s03-clap", { rotate: -26, svgOrigin: "6 36" }, { rotate: 0, svgOrigin: "6 36", duration: .9, ease: "power3.out" }, tVid + .5);

  // ---- conversión: se desintegran, cruzan el prisma y se reconstruyen ----
  const TS = [9.02, 9.24, 9.58];
  const BOX = [[322, 369, 96, 122], [292, 552, 156, 96], [302, 712, 136, 116]];
  const REG = [[1232, 395, 285, 190], [1232, 612, 262, 100], [1232, 776, 225, 62]];
  const PK = $("#s03-pk"), N = 22, FL = 1.2;
  const mix = (a, w) => "rgb(" + a.map((v) => Math.round(v + (255 - v) * w)).join(",") + ")";
  const sm = (x, a, b) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  for (let i = 0; i < 3; i++) {
    // el objeto se disuelve
    tl.to("#s03-o" + i, { opacity: 0, scale: 1.12, filter: "blur(8px)", duration: .8, ease: "power2.in" }, TS[i] + .05);
    tl.to("#s03-l" + i, { opacity: 0, duration: .6, ease: "power2.in" }, TS[i]);
    for (let j = 0; j < N; j++) {
      const p = document.createElement("div"); p.className = "s03-p"; PK.appendChild(p);
      const sz = 6 + rnd() * 8; p.style.width = p.style.height = sz + "px"; p.style.margin = (-sz / 2) + "px 0 0 " + (-sz / 2) + "px";
      p.style.boxShadow = " 0 0 12px rgba(255,255,255,.07)" + COL[i] + "aa";
      const sx = BOX[i][0] + rnd() * BOX[i][2], sy = BOX[i][1] + rnd() * BOX[i][3];
      const cx = 830 + (rnd() - .5) * 52, cy = 600 + (rnd() - .5) * 90;
      const tx = REG[i][0] + rnd() * REG[i][2], ty = REG[i][1] + rnd() * REG[i][3];
      const A = [sx, sy, sx + 200, sy + (cy - sy) * .15, cx - 140, cy, cx, cy];
      const B = [cx, cy, cx + 150, cy, tx - 220, ty, tx, ty];
      const st = TS[i] + rnd() * .3, pr = { t: 0 };
      tl.to(pr, { t: 1, duration: FL + rnd() * .2, ease: "none", onUpdate: () => {
        const t = pr.t; let q;
        if (t < .5) { const u = t * 2; q = AC.bez(A, 1 - (1 - u) * (1 - u)); } else { const v = (t - .5) * 2; q = AC.bez(B, Math.pow(v, 1.7)); }
        const k = Math.exp(-Math.pow((t - .5) / .1, 2));
        const s = (1 + .8 * k) * (1 - sm(t, .88, 1));
        p.style.opacity = Math.min(1, t / .08) * (1 - sm(t, .9, 1));
        p.style.transform = "translate(" + q.x.toFixed(1) + "px," + q.y.toFixed(1) + "px) scale(" + s.toFixed(3) + ")";
        p.style.background = mix(RGB[i], k);
      } }, st);
    }
  }
  // halo y haces de salida acompañan la conversión
  tl.to("#s03-halo", { opacity: 1, scale: 1.08, duration: 1.2, ease: "power2.inOut" }, 9.0);
  tl.to("#s03-halo", { opacity: .5, scale: 1, duration: 1.4, ease: "power2.inOut" }, 11.3);
  tl.to(outB, { opacity: .9, duration: 1.0, ease: "power2.out" }, 9.1);
  tl.to(outB, { opacity: .35, duration: 1.4, ease: "power2.inOut" }, 11.4);
  tl.to(inB, { opacity: .3, duration: 1.2, ease: "power2.inOut" }, 10.4);

  // ---- hoja de estudio ----
  tl.fromTo("#s03-sheet", { opacity: 0, x: 40, rotateY: -28, transformPerspective: 1500, transformOrigin: "0 50%" }, { opacity: 1, x: 0, rotateY: 0, duration: 1.3, ease: "power3.out" }, c("materiales") - .05);
  tl.to("#s03-ghost", { opacity: 0, duration: .8, ease: "power2.out" }, c("materiales") + .5);
  const wipe = (sel, t, d) => tl.to(sel, { clipPath: "inset(0 0% 0 0)", duration: d, ease: "power2.inOut" }, t);
  wipe("#s03-s1", 10.25, 1.0); wipe("#s03-s2", 10.5, 1.0); wipe("#s03-s3", 10.82, 1.0);
  [["#s03-b1", 10.25], ["#s03-b2", 10.5], ["#s03-b3", 10.82]].forEach((b) => tl.fromTo(b[0], { opacity: 0, scale: .4 }, { opacity: 1, scale: 1, duration: .8, ease: "back.out(2)", transformOrigin: "50% 50%" }, b[1] - .1));
  // "estructurados": los apartados se separan y la hoja se enciende ordenada
  tl.to("#s03-d1", { scaleX: 1, duration: 1.0, ease: "power2.inOut" }, c("estructurados") + .15);
  tl.to("#s03-d2", { scaleX: 1, duration: 1.0, ease: "power2.inOut" }, c("estructurados") + .45);
  tl.to("#s03-sheet", { boxShadow: " 0px 16px 34px rgba(0,0,0,0.28), 0 0 60px rgba(255,255,255,.07), inset 0 1px 0 rgba(255,255,255,.5)", duration: 1.3, ease: "power2.inOut" }, c("estructurados"));

  // ---- sello de alta calidad ----
  const ts = c("alta") - .02;
  tl.fromTo("#s03-seal", { opacity: 0, scale: 1.18, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: .9, ease: "power3.out" }, ts);
  tl.to("#s03-sout", { strokeDashoffset: 0, duration: .9, ease: "power2.inOut" }, ts);
  tl.to("#s03-sfill", { opacity: .95, duration: .7, ease: "power2.out" }, ts + .2);
  tl.to("#s03-sring", { strokeDashoffset: 0, duration: .8, ease: "power2.inOut" }, ts + .25);
  tl.to("#s03-schk", { strokeDashoffset: 0, duration: .55, ease: "power2.out" }, ts + .5);
  tl.to(["#s03-st1", "#s03-st2"], { opacity: 1, duration: .5, ease: "power2.out", stagger: .12 }, c("calidad") + .05);

  // ---- cámara: empuje suave durante toda la escena ----
  tl.to("#s03-stage", { scale: 1.018, duration: D, ease: "none" }, 0);

  window.__timelines["s03-que-es"] = tl;
})();
</script>
