<script>
(function () {
  const S = "s06", B = "b06", $ = (id) => document.getElementById(id);
  const tl = gsap.timeline({ paused: true });
  const cDos0 = AC.cue(S, B, "dos", 0), cMod = AC.cue(S, B, "modelos", 0), cJun = AC.cue(S, B, "juntos"), cLen = AC.cue(S, B, "lenguaje"),
    cEnt = AC.cue(S, B, "entienden"), cRed = AC.cue(S, B, "redactan"), cVis = AC.cue(S, B, "visión"), cInt = AC.cue(S, B, "interpretan"),
    cAna = AC.cue(S, B, "analizan"), cMat = AC.cue(S, B, "material");

  // iconos
  $("s06-oL").innerHTML = AC.svg("cerebro", 78);
  $("s06-oR").innerHTML = AC.svg("ojo", 78);
  $("s06-fuse").innerHTML = AC.svg("cerebro", 66) + AC.svg("ojo", 66);
  $("s06-ria").innerHTML = AC.svg("texto", 28); $("s06-rib").innerHTML = AC.svg("imagen", 28);
  const ck = (id) => '<svg class="ac-ico ck" viewBox="0 0 48 48"><path id="' + id + '" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M10 25l9 9 19-20"/></svg>';
  $("s06-ra").insertAdjacentHTML("beforeend", ck("s06-cka")); $("s06-rb").insertAdjacentHTML("beforeend", ck("s06-ckb"));

  // posiciones de reposo en 3D
  gsap.set("#s06-cL", { transformPerspective: 1800, rotateY: 8 });
  gsap.set("#s06-cR", { transformPerspective: 1800, rotateY: -8 });

  // tokens de lenguaje
  const TK = [
    { w: "ecosistema", x: 40, y: 190, wd: 190 }, { w: "depredador", x: 262, y: 216, wd: 190 }, { w: "especie", x: 500, y: 190, wd: 140 },
    { w: "hábitat", x: 64, y: 274, wd: 140 }, { w: "conservación", x: 250, y: 292, wd: 220 }, { w: "presa", x: 500, y: 266, wd: 120 }
  ];
  const tks = $("s06-tks"), rel = $("s06-rel");
  TK.forEach((t, i) => {
    const d = document.createElement("div"); d.className = "s06-tk"; d.id = "s06-tk" + i; d.textContent = t.w;
    d.style.left = t.x + "px"; d.style.top = t.y + "px"; d.style.width = t.wd + "px"; tks.appendChild(d);
  });
  const EDGES = [[0,1],[1,2],[2,5],[1,4],[0,3],[3,4],[4,5]];
  EDGES.forEach((e, i) => {
    const a = TK[e[0]], b = TK[e[1]], l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    l.setAttribute("x1", a.x + a.wd / 2); l.setAttribute("y1", a.y + 24); l.setAttribute("x2", b.x + b.wd / 2); l.setAttribute("y2", b.y + 24);
    l.setAttribute("stroke", "#9dc0ff"); l.setAttribute("stroke-width", "2.5"); l.setAttribute("stroke-linecap", "round");
    l.setAttribute("pathLength", "1"); l.setAttribute("stroke-dasharray", "1"); l.setAttribute("stroke-dashoffset", "1"); l.id = "s06-ed" + i; rel.appendChild(l);
  });

  // frase redactada
  const SEG = [["El ", 0], ["depredador", 1], [" regula el ", 0], ["ecosistema", 1], [" y apoya la ", 0], ["conservación", 1], [" de la especie.", 0]];
  const TOTAL = SEG.reduce((a, s) => a + s[0].length, 0), sent = $("s06-sent");
  function render(n) {
    let out = "", left = n;
    for (const s of SEG) { if (left <= 0) break; const p = s[0].slice(0, left); left -= p.length; out += s[1] ? '<span class="k">' + p + "</span>" : p; }
    sent.innerHTML = out + '<span class="cur"></span>';
  }
  render(0);

  /* ---------- 1. «dos tipos de modelos trabajando juntos» ---------- */
  AC.line(tl, "#s06-t1", cDos0 - .05, 9.25);
  tl.fromTo("#s06-oL", { opacity: 0, scale: .4, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 1.3, ease: "expo.out" }, cMod - .15);
  tl.fromTo("#s06-oR", { opacity: 0, scale: .4, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 1.3, ease: "expo.out" }, cMod + .3);
  tl.fromTo("#s06-bl", { opacity: 0 }, { opacity: 1, duration: 1.6, ease: "power2.out" }, cMod - .15);
  tl.fromTo("#s06-br", { opacity: 0 }, { opacity: 1, duration: 1.6, ease: "power2.out" }, cMod + .3);
  // hilo de luz entre los dos «trabajando juntos»
  const p0 = [588, 590, 780, 470, 1140, 710, 1332, 590];
  AC.link(tl, $("s06-g0"), p0, cJun - .5, 1.3, "#cfe6ff");
  AC.packet(tl, $("s06tecnologia"), p0, cJun - .15, 1.3, "power1.inOut");
  tl.to("#s06-g0", { opacity: 0, duration: .7, ease: "power2.in" }, cLen - .45);

  /* ---------- 2. lenguaje: entiende y redacta ---------- */
  const tL = cLen - .3;
  tl.fromTo("#s06-glL", { opacity: 0, scale: .55, x: -50, rotateY: 26, transformPerspective: 1800 }, { opacity: 1, scale: 1, x: 0, rotateY: 0, duration: 1.3, ease: "expo.out" }, tL);
  tl.to("#s06-oL", { x: -258, y: -222, scale: .56, duration: 1.2, ease: "power2.inOut" }, tL);
  tl.fromTo("#s06-hL", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: .9, ease: "power3.out" }, tL + .6);
